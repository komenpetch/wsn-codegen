# Structure 4 (EbWsn) against the MintRoute baseline, on one field.
#
# WHY THIS HARNESS EXISTS. D16 (design/NextHop_Extension_Draft.md): v4's working
# functions are matched to the baseline the way SensorApp's were -- measure, RUN
# AND COMPARE COUNTERS, fix the generator, re-measure. This is the run. User,
# 2026-10-12: the nine-node SensorScope field (Q1 = a), and no DATA in either
# module (Q2: v4 has none, D10, so the baseline runs without apps too).
#
# The baseline is this project's INET port, src/inet/networklayer/mintroute/,
# compiled into libINET, so this one executable runs both modules.
#
# [General] is ../v3_flood's [General] -- the field, radio, MAC and queue every
# structure-3 measurement was taken on -- with v3_flood's two module-specific
# lines (tickInterval, headerLength) moved into [Config V4]: written with
# `**.generic.np.*` they would also reach MintRoute's own `np` and override its
# headerLength default (96b).

[General]
network = SensorScopeNetwork
sim-time-limit = 60s

**.hasIpv4 = false
**.hasGn   = true
*.visualizer.osgVisualizer.typename = ""

# No apps on any node, in either config (Q2).
*.sensor*.numApps = 0
*.sink.numApps    = 0

*.sink.generic.np.sinkAddress    = "sink"
*.sensor*.generic.np.sinkAddress = "sink"

# ---- Radio: verbatim from ../v3_flood ----
**.wlan[*].typename                   = "WirelessInterface"
**.wlan[*].radio.typename             = "ApskScalarRadio"
**.radio.centerFrequency              = 2.45GHz
**.radio.bandwidth                    = 2.8MHz
**.radio.transmitter.bitrate          = 19200bps
**.radio.transmitter.power            = 2.24mW
**.radio.transmitter.headerLength     = 8b
**.radio.transmitter.preambleDuration = 0.0001s
# ⚠ -85dBm, NOT -100dBm (MyWSN's). At -100dBm every node hears every other one
# and the four-hop field collapses into a mesh. Check `attr configname` and the
# PER-MODULE sensitivity line in the .sca before reading any result here.
**.radio.receiver.sensitivity         = -85dBm
**.radio.receiver.energyDetection     = -90dBm
**.radio.receiver.snirThreshold       = -8dB
**.maxTransmissionDuration            = 100ms
*.radioMedium.backgroundNoise.power   = -110dBm

# ---- MAC + queue: verbatim from ../v3_flood ----
**.wlan[*].mac.typename         = "Smac"
**.wlan[*].mac.listenDuration   = 0.3s
**.wlan[*].mac.frameDuration    = 1s
**.wlan[*].mac.allowedDrift     = 0.03s
**.wlan[*].mac.bitrate          = 19200bps
**.wlan[*].mac.headerLength     = 72b
**.wlan[*].mac.ctrlFrameLength  = 160b
**.wlan[*].mac.queueLength      = 10
**.wlan[*].queue.typename       = "DropTailQueue"
**.wlan[*].queue.packetCapacity = 20

*.configurator.addStaticRoutes  = false
*.configurator.addDefaultRoutes = false
*.configurator.addSubnetRoutes  = false

# ---------------------------------------------------------------------------
# [Config V4] -- the generated structure 4, wsn-codegen 266ad76
# (`npm run generate -- AppLayer out-v4 --v4`), with ../v3_flood [Config Sink]'s
# settings: the sink is a destination, so the eight sensors originate.
#
# PREDICTION: every flood counter equals ../v3_flood [Config Sink]'s recorded
# run, because structure 4 is structure 3 plus a data path nothing schedules and
# minus route publication, which produces no simulation events (2026-09-20):
#   create_routePkt 88 and create_beaconPkt 88 in total, 11 + 11 per sensor, 0 on
#   the sink; send_down 763; receive_controlPkt + receive_dup_controlPkt = MAC
#   Rx = send_up = 1677; dest_recv_pkt 68; queue overflow 180.
#   The data events (create_dataPkt, _bct, _fwd, receive_dataPkt,
#   receive_dup_dataPkt) fire 0 times.
# FALSIFIER: any flood counter that differs means step 3b changed behaviour, and
# nothing below should be compared until that is explained.
# RESULT (266ad76 and D16 piece 1): held exactly, every counter.
#
# D16 PIECE 2 (2026-10-12): the one model timer is replaced by one per packet
# type, as MintRoute has (beaconFloodsInterval / routeFloodsInterval, set below
# to the baseline's 5s / 20s), each armed on every node.
# PREDICTION: on every sensor fired:create_beaconPkt = 11 (first at
#   uniform(0.1,0.9)+5s, then every 5s) and fired:create_routePkt = 3 (first near
#   5s, then 25s, 45s); 0 on the sink, which is in Dests. Totals 88 and 24
#   (were 88 and 88). With a third fewer originations, queue overflow < 180.
# FALSIFIER: any sensor whose create counts are not 11 and 3.
# RESULT: held exactly; overflow 180 -> 64.
#
# D16 PIECE 3 (2026-10-12): the receive side under MintRoute's names --
# handleLowerPacket dispatches by type to onReceive<Type>Pkt, add_newEntry and
# update_nbr become newEntry / findOrCreateEntry() / updateNbrCounters, all
# still inside the delivery fixpoint.
# PREDICTION: renames and a dispatch to the same runDeliveryEvents(), so every
#   fired:, MAC and queue scalar equals the piece-2 run (event #38285). New:
#   nbRouteFloodsReceived, at most each node's MAC Rx.
# FALSIFIER: any other scalar that moves.
# RESULT: held exactly.
#
# STEP 3d (2026-10-12): route publication for both tables (D5) and the data
# send's unicast branch (never run: no DATA).
# PREDICTION: publishing creates no simulation events, so every scalar equals
#   the piece-3 run (event #38285). The log (`--cmdenv-log-level=info`) shows one
#   "one-hop route to" per neighbour-table entry, = sum of fired:add_newEntry
#   (31), and no "route to ... via" through another node: nothing calls
#   addEntry until a Specific class does (3e/3f).
# FALSIFIER: a scalar that moves, or a route count other than add_newEntry's.
# RESULT: held exactly; 31 one-hop routes.
#
# STEP 3e (2026-10-12): RouteTableBase -> PRouteTable -> the module; addEntry
# carried into PRouteTable, never scheduled; _fwd now scheduled.
# PREDICTION: classes move code and change no behaviour, so every scalar equals
#   the 3d run (event #38285) and the log shows the same 31 one-hop routes. No
#   fired:addEntry (nothing calls it before a Specific class) and no
#   fired:start_tx_dataPkt_fwd (no data packet exists).
# FALSIFIER: any scalar that moves.
# RESULT: held exactly; event #38285, 31 one-hop routes, neither fires.
#
# FRAME SIZE (2026-10-13, user "q1 a"): structure 4 now applies headerLength in
# the unit the shell declares, bits, so the 80b below is a 10-byte frame (it was
# 80 bytes: the transmit applied the number as bytes, as the baseline does).
# Every result above, and 3g's below, was recorded with 80-byte frames.
# PREDICTION: the frame is now exactly what the probe run with
#   `headerLength=10b` on the old code produced (B(10) = b(80) = 10 bytes), so
#   V4 equals that probe scalar for scalar: event #36346, overflow 0, the sink
#   consumes 112 of 112; and Parent / ParentPlain equal the probe's Parent:
#   event #78440, the same tree, 6208 receptions. MintRoute's copied transmit
#   takes the same one-line change, or check_copy.mjs refuses the build.
# FALSIFIER: any scalar differing from the probe's.
# RESULT (2026-10-13): held exactly. V4 = the probe, 682 of 682 scalars, event
#   #36346; Parent = the probe's Parent, 901 of 901, event #78440; ParentPlain
#   #78440 with 0 scalars differing from Parent (mrt:* aside). Same tree;
#   4320 of 4320 route arrivals carried the fields. Loop, invariants, type and
#   leak checks GREEN (0 of 6208 deliveries waiting).
# ---------------------------------------------------------------------------
[Config V4]
description = "generated structure 4 (EbWsn), sink as destination"
*.sink.generic.typename    = "EbWsnNetworkLayer"
*.sensor*.generic.typename = "EbWsnNetworkLayer"
*.sink.generic.np.inDests  = true
**.generic.np.beaconFloodsInterval = 5s
**.generic.np.routeFloodsInterval  = 20s
**.generic.np.headerLength = 80b

# ---------------------------------------------------------------------------
# [Config Baseline] -- MintRoute, as MyWSN [Config MintRoute] sets it, minus
# SensorApp: beacons from the sink every 5s, route floods from every node every
# 20s, headerLength at the module's own default.
#
# PREDICTION, read off MintRoute.cc (initialize, handleSelfMessage):
#   nbBeaconsSent: sink 11 (first at uniform(0.1,0.9)+5s, then every 5s), every
#     sensor 0 (the timer is armed only where myNetwAddr == sinkAddress).
#   nbRouteFloodsSent: 3 on every node (sink first near 1s, sensors near 5s,
#     then every 20s).
#   nbRouteFloodsReceived: at most 3 x the node's radio neighbours, because a
#     received BEACON or ROUTE is never rebroadcast (MintRoute.cc:216-247).
#   nbData*: 0 (no apps).
# FALSIFIER: a sensor with nbBeaconsSent > 0, or a node whose
# nbRouteFloodsSent is not 3, means the config is not what the code was read
# against; a node receiving more route floods than 3 x its neighbours means
# something rebroadcasts.
# ---------------------------------------------------------------------------
[Config Baseline]
description = "INET MintRoute port (the baseline), no apps"
*.sink.generic.typename    = "MintRouteNetworkLayer"
*.sensor*.generic.typename = "MintRouteNetworkLayer"
*.sink.generic.np.beaconFloodsInterval    = 5s
*.sink.generic.np.routeFloodsInterval     = 20s
*.sensor*.generic.np.beaconFloodsInterval = 0s
*.sensor*.generic.np.routeFloodsInterval  = 20s

# ---------------------------------------------------------------------------
# [Config Parent] -- step 3g: MintRoute's Specific class (MintRoute.{h,cc,ned},
# MintRouteTable.h, MintRoutePkt.h) on the generated structure 4, through the
# wrapper loop.sh derives (EbMintRouteNetworkLayer). Settled with the user
# 2026-10-13: the baseline's four ETX functions and its route fields, ported
# under its own names (Q1); the sink out of Dests, so it originates and can be
# a parent (Q3); only the sink beacons, as MintRoute.cc:84 and [Config
# Baseline] above have it (Q8); 300 s at the baseline's constants (Q6).
#
# PREDICTION, written before the first run:
#   - Every model scalar (fired:*, nb*, packets sent/received, MAC, queue) equals
#     the probe of the same settings on the generated module alone (v4_static
#     [Config Plain] + sink out of Dests + sensors' beaconFloodsInterval 0s,
#     300 s: event #123697, queue overflow 0 on every node): the class adds
#     fields inside the same fixed-length chunk and calls addEntry, and neither
#     creates a simulation event or draws a random number.
#   - Beacons: sink 59, sensors 0. Route floods: 15 on every node.
#   - Parents: sensor6 -> the sink at its third route timer (~45 s, the first
#     estimate; the sink estimated at ~41 s); sensor3/5/8 at ~65 s;
#     sensor2/4/7 at ~85 s; sensor1 at ~105 s. Final hops = shortest paths:
#     sensor6 1, sensor3/5/8 2, sensor2/4/7 3, sensor1 4.
#   - loop.sh's gates hold: every sensor has a parent it has heard, parents
#     reach the sink, the sink is its own root at cost 0, INET's route to the
#     sink is via the parent, no data event, every ROUTE arrival carries the
#     fields (routeFieldsMissing 0, routeFieldsRead = nbRouteFloodsReceived);
#     addEntry refused 0.
#   - invariants.sh GREEN (I9a over the nodes whose timer is armed).
# FALSIFIER: a model scalar that differs from the probe; a sensor without a
#   parent at 300 s; a parent not heard; parents that loop.
# ---------------------------------------------------------------------------
[Config Parent]
description = "MintRoute's Specific class on structure 4: ETX parent choice"
extends = V4
*.sink.generic.typename    = "EbMintRouteNetworkLayer"
*.sensor*.generic.typename = "EbMintRouteNetworkLayer"
*.sink.generic.np.inDests  = false
*.sensor*.generic.np.beaconFloodsInterval = 0s

# ---------------------------------------------------------------------------
# [Config ParentPlain] -- [Config Parent]'s control: the same settings on the
# generated module alone, as v4_static's Plain is to Static.
# PREDICTION: the probe of these settings exactly (event #123697 at 300 s).
# FALSIFIER: any difference means this config is not what the probe ran.
# ---------------------------------------------------------------------------
[Config ParentPlain]
description = "[Config Parent]'s settings on the generated module alone"
extends = Parent
*.sink.generic.typename    = "EbWsnNetworkLayer"
*.sensor*.generic.typename = "EbWsnNetworkLayer"
