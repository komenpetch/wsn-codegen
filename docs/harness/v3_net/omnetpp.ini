# Structure 3 as a NETWORK PROTOCOL, on the nine-node SensorScope field.
#
# WHY THIS HARNESS EXISTS. Structure 3 emitted an `ApplicationBase` until
# 2026-09-21 and ran in `../v3_bundled` as `app[0].typename = "Pm3Wsn"` over a
# full IPv4 stack. It is `NetworkProtocolBase, INetworkProtocol` now -- the
# GREEN Interface + Base pair of the 4x4 pattern class diagram -- so it is no
# longer an application and that wiring cannot hold it.
#
# WHAT CHANGED, AND NOTHING ELSE. The stack settings below are
# `inet4.5/codegen_results`' -- the proven network-layer harness that runs the
# generated M4Wsn -- and the radio, MAC, queue and topology settings are
# `../v3_bundled`'s, unchanged, so the field and the link are the same ones
# every recorded structure-3 measurement was taken on. The four lines that
# differ are the layer itself:
#
#     hasIpv4  true -> false      no IP stack under the module any more
#     hasGn    false -> true      the `generic` network-layer slot exists
#     numApps  1 -> 0             the module is not an application
#     app[0]   -> generic.np      where its parameters now live
#
# ⚠ AND THREE APP-ERA WORKAROUNDS ARE DELIBERATELY ABSENT, not forgotten:
#   - `**.ipv4.ip.limitedBroadcast = true`, which Ipv4 needed or it silently
#     DROPPED every broadcast the model handed down. There is no Ipv4 here.
#   - `app[0].startTime`, because the shell spreads its own first tick
#     (`uniform(0.1, 0.9) + tickInterval`), exactly as MintRoute spreads its
#     first beacon flood.
#   - `app[0].payloadLength`, a SensorApp member the shell swap removed. The
#     frame is sized by the network shell's own `headerLength`, set below to
#     80b = the 10B the app-layer runs used, so the frame is the same size.

[General]
network = SensorScopeNetwork
sim-time-limit = 60s

# ---- Stack: no IP, the generated network layer in the `generic` slot ----
# hasGn is what makes SensorNode instantiate `generic` at all; with it false
# there is no slot to put the module in.
**.hasIpv4 = false
**.hasGn   = true
*.visualizer.osgVisualizer.typename = ""

*.sensor*.numApps = 0
*.sink.numApps    = 0

# Pm3WsnNetworkLayer is generated alongside Pm3Wsn in the same .ned -- a
# network protocol needs a wrapper carrying ARP and a dispatcher, and INET's
# own MintRoute ships MintRouteNetworkLayer for exactly this reason.
*.sink.generic.typename    = "Pm3WsnNetworkLayer"
*.sensor*.generic.typename = "Pm3WsnNetworkLayer"

# The node the model calls Sink, resolved the way every INET protocol resolves
# a named node. ⚠ The model declares no Sink constant, so this is inert for the
# model's own guards; it is what lets a node recognise itself by address.
*.sink.generic.np.sinkAddress    = "sink"
*.sensor*.generic.np.sinkAddress = "sink"

# How often the module asks the model which events are enabled. 5s, matching
# ../v3_bundled's [Config MultiHopLowLoad], which is the rate the recorded
# structure-3 measurements were taken at -- INET's own MintRoute.ned declares
# beaconFloodsInterval = default(5s), and the app harness's 1s was SensorApp's
# DATA sampling rate driving a CONTROL flood five times too fast.
**.generic.np.tickInterval = 5s

# 80b = 10B, the payloadLength the app-layer runs used, so the frame on the air
# is the same size as the one every recorded measurement was taken with.
**.generic.np.headerLength = 80b

# ---- Radio: verbatim from ../v3_bundled ----
**.wlan[*].typename                   = "WirelessInterface"
**.wlan[*].radio.typename             = "ApskScalarRadio"
**.radio.centerFrequency              = 2.45GHz
**.radio.bandwidth                    = 2.8MHz
**.radio.transmitter.bitrate          = 19200bps
**.radio.transmitter.power            = 2.24mW
**.radio.transmitter.headerLength     = 8b
**.radio.transmitter.preambleDuration = 0.0001s
# ⚠ -85dBm, NOT -100dBm. At -100dBm the range is 1458 m over a 780 m field, so
# every node hears every other one and the four-hop topology collapses into a
# mesh while still looking like a multi-hop run. The giveaway is every sensor
# reporting an IDENTICAL nbRxDataPackets. Check `attr configname` and the
# PER-MODULE sensitivity line in the .sca before reading any result here.
**.radio.receiver.sensitivity         = -85dBm
**.radio.receiver.energyDetection     = -90dBm
**.radio.receiver.snirThreshold       = -8dB
**.maxTransmissionDuration            = 100ms
*.radioMedium.backgroundNoise.power   = -110dBm

# ---- MAC + queue: verbatim from ../v3_bundled [Config MultiHopLowLoad] ----
**.wlan[*].mac.typename         = "Smac"
# 0.3s, not Smac's own 0.075s default: at a 7.5% duty cycle the first-hop node
# saturates and drops packets to interface-queue overflow, which is a statement
# about the link rather than about the protocol.
**.wlan[*].mac.listenDuration   = 0.3s
**.wlan[*].mac.frameDuration    = 1s
**.wlan[*].mac.allowedDrift     = 0.03s
**.wlan[*].mac.bitrate          = 19200bps
**.wlan[*].mac.headerLength     = 72b
**.wlan[*].mac.ctrlFrameLength  = 160b
**.wlan[*].mac.queueLength      = 10
**.wlan[*].queue.typename       = "DropTailQueue"
**.wlan[*].queue.packetCapacity = 20

# The configurator adds nothing, so the one-hop routes the model publishes into
# IRoutingTable are that table's only occupants.
*.configurator.addStaticRoutes  = false
*.configurator.addDefaultRoutes = false
*.configurator.addSubnetRoutes  = false

# ---------------------------------------------------------------------------
# [Config Sink] -- the flood, with the sink as a destination.
#
# `Dests` is a node subset the axioms leave open, so the harness supplies it.
# Naming the sink a destination REMOVES it as an originator (the creating event
# guards `x ∈ ND ∖ Dests`) and makes it CONSUME instead of rebroadcast, so the
# flood terminates at the sink rather than being amplified by it.
#
# PREDICTION: the sink creates nothing and rebroadcasts nothing; the eight
# sensors each originate; packets are retired at the sink.
# FALSIFIER: if the sink still rebroadcasts, the parameter is not reaching
# `ND ∖ Dests` and nothing below should be read as a flood result.
# ---------------------------------------------------------------------------
[Config Sink]
description = "the flood, sink as destination -- compare against ../v3_bundled [Config Sink]"
extends = General
*.sink.generic.np.inDests = true

# ---------------------------------------------------------------------------
# [Config SinkBeacon] -- the sink is the only originator.
#
# Putting the eight sensors in `Dests` leaves the sink as the only node outside
# it, so it is the only node that can originate.
#
# ⚠ THIS IS A SINK BROADCAST, NOT A SINK-SEEDED FLOOD. `Dests` does double duty
# -- a node that consumes is a node that does not forward -- so the sensors
# receive and stop. On this field the sink has exactly ONE neighbour, so the
# reach is 1 of 8. Do not quote it as a flood.
# ---------------------------------------------------------------------------
[Config SinkBeacon]
description = "sink-originated one-hop broadcast; the sensors consume and do not forward"
extends = General
*.sensor*.generic.np.inDests = true
