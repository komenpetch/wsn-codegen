# Step 3f: the run test of the next-hop design's route-table half
# (design/NextHop_Extension_Draft.md D13, §7; settled with the user 2026-10-12).
#
# WHY THIS HARNESS EXISTS. Structure 4 gives the model a route table (PRouteTable)
# whose only operation, addEntry, is never scheduled: a Specific class calls it
# (D1). Nothing called it before this harness, so route entries had never reached
# INET's table in a run. StaticRoutes (StaticRoutes.{h,ned,cc}) is a Specific
# class with no routing logic -- a fixed list of entries -- so whatever fails
# here belongs to the generated code. No DATA (D10).
#
# The field, radio, MAC and queue are ../v3_flood's [General], verbatim. The
# module settings are ../v4_mintroute [Config V4]'s: the baseline's timers, 5s
# beacons and 20s route floods (user, Q1 = b), header 80b, sink in Dests.
#
# Two configs, identical but for the module type:
#   [Config Plain]   the generated EbWsn, through its own wrapper
#   [Config Static]  StaticRoutes, through the wrapper loop.sh derives (Q6)

[General]
network = SensorScopeNetwork
sim-time-limit = 60s

**.hasIpv4 = false
**.hasGn   = true
*.visualizer.osgVisualizer.typename = ""

# No apps on any node (D10).
*.sensor*.numApps = 0
*.sink.numApps    = 0

*.sink.generic.np.sinkAddress    = "sink"
*.sensor*.generic.np.sinkAddress = "sink"

# The sink is a destination: it originates nothing and forwards nothing, so
# no node ever hears it (31 neighbour entries, not 32).
*.sink.generic.np.inDests = true

# The baseline's timers (MintRoute.ned: beaconFloodsInterval 5s, and the 20s
# route flood MyWSN [Config MintRoute] sets). chooseParent() runs on the route
# timer: on every sensor at ~5.000005s, 25s and 45s.
**.generic.np.beaconFloodsInterval = 5s
**.generic.np.routeFloodsInterval  = 20s

# 80b = a 10-byte frame, because structure 4 applies the length in the unit the
# shell declares, bits (wsn-codegen, 2026-10-13). Before that change, and in
# every structure-3 run, the transmit applied the number as bytes, so the same
# 80b made 80-byte frames (90 B on air), and the results recorded here before
# 2026-10-13 carry those.
**.generic.np.headerLength = 80b

# ---- Radio: verbatim from ../v3_flood ----
**.wlan[*].typename                   = "WirelessInterface"
**.wlan[*].radio.typename             = "ApskScalarRadio"
**.radio.centerFrequency              = 2.45GHz
**.radio.bandwidth                    = 2.8MHz
**.radio.transmitter.bitrate          = 19200bps
**.radio.transmitter.power            = 2.24mW
**.radio.transmitter.headerLength     = 8b
**.radio.transmitter.preambleDuration = 0.0001s
# ⚠ -85dBm, NOT -100dBm. At -100dBm every node hears every other one and the
# four-hop field collapses into a mesh. Check `attr configname` and the
# PER-MODULE sensitivity line in the .sca before reading any result here.
**.radio.receiver.sensitivity         = -85dBm
**.radio.receiver.energyDetection     = -90dBm
**.radio.receiver.snirThreshold       = -8dB
**.maxTransmissionDuration            = 100ms
*.radioMedium.backgroundNoise.power   = -110dBm

# ---- MAC + queue: verbatim from ../v3_flood ----
**.wlan[*].mac.typename         = "Smac"
**.wlan[*].mac.listenDuration   = 0.3s
**.wlan[*].mac.frameDuration    = 1s
**.wlan[*].mac.allowedDrift     = 0.03s
**.wlan[*].mac.bitrate          = 19200bps
**.wlan[*].mac.headerLength     = 72b
**.wlan[*].mac.ctrlFrameLength  = 160b
**.wlan[*].mac.queueLength      = 10
**.wlan[*].queue.typename       = "DropTailQueue"
**.wlan[*].queue.packetCapacity = 20

# The configurator adds nothing, so INET's table holds only what the module
# publishes.
*.configurator.addStaticRoutes  = false
*.configurator.addDefaultRoutes = false
*.configurator.addSubnetRoutes  = false

# ---------------------------------------------------------------------------
# [Config Plain] -- the generated module alone, the control run (Q7).
#
# PREDICTION: this is ../v4_mintroute [Config V4] exactly (same module, same
#   settings, same field): every scalar equal, event #38285, 31 one-hop routes.
# FALSIFIER: any difference means this harness is not the one the 3e run was
#   taken on, and Static cannot be compared against it.
# RESULT (2026-10-12): held; event #38285.
#
# FRAME SIZE (2026-10-13): structure 4 now applies headerLength in bits, so 80b
# is a 10-byte frame (see the headerLength line above).
# PREDICTION: still ../v4_mintroute [Config V4] exactly, which at 10 bytes is
#   the probe's run: event #36346, overflow 0, the sink consumes 112 of 112, and
#   still 31 one-hop routes (the sink, in Dests, still transmits nothing).
# FALSIFIER: any scalar differing from v4_mintroute's V4.
# RESULT (2026-10-13): held; 682 of 682 scalars equal to v4_mintroute's V4,
#   event #36346.
# ---------------------------------------------------------------------------
[Config Plain]
description = "generated structure 4 (EbWsn), no Specific class"
*.sink.generic.typename    = "EbWsnNetworkLayer"
*.sensor*.generic.typename = "EbWsnNetworkLayer"

# ---------------------------------------------------------------------------
# [Config Static] -- StaticRoutes, routes to the sink one hop closer each,
# picked from the measured neighbour sets (hops: sensor6 1; sensor3/5/8 2;
# sensor2/4/7 3; sensor1 4). sensor6's next hop is the sink, which no node
# ever hears (Q2: kept, refused for the whole run). sensor3 also routes to
# sensor5, a node it hears, via sensor6 (Q3: D5's "route entry in place of a
# one-hop route"). sensor1 moves from sensor2 to sensor4 at 30s (Q4, D15).
#
# PREDICTION, from the measured first-heard times (v4_mintroute [Config V4]:
#   every chosen next hop first heard between 5.06s and 13.09s):
#   - at ~5.000005s every sensor calls addEntry before anything is heard: 9
#     calls, all refused; at 25s 9 calls, 8 accepted (all but sensor6's); at
#     45s sensor6's (refused) and sensor1's update (accepted). Totals:
#     static:calls 20, accepted 9, refused 11, mismatch 0.
#   - static:overrodeOneHop 1 (sensor3's sensor5); static:routesChecked 8,
#     routesWrong 0. INET's final tables: 30 one-hop routes and 8 through
#     another node (7 to the sink, sensor3's to sensor5).
#   - update: applied 1, old route installed 1, new route installed 1,
#     others changed 0.
#   - the log: 31 "one-hop route to", 7 "route to sink... via", 2 "now via"
#     (sensor3's route to sensor5 at 25s, sensor1's to the sink at 45s).
#   - start_tx_dataPkt_bct, start_tx_dataPkt_fwd, receive_dataPkt and
#     receive_dup_dataPkt fire 0 times (no data packet exists).
#   - every scalar but static:* equal to [Config Plain], event #38285: route
#     entries are read only by the data transmit, which never runs.
# FALSIFIER: a mismatch, a wrong route, a changed other route, or any flood
#   scalar different from Plain's.
# RESULT (2026-10-12): held exactly, every number above; event #38285, 0
#   scalars differing from Plain. (The log count was first misread as 38
#   routes through another node: the grep also matched the 31 one-hop lines.)
#
# FRAME SIZE (2026-10-13), 10-byte frames:
# PREDICTION: every static:* number above unchanged. The first frame still goes
#   out after 5.1s (the timers start at uniform(0.1,0.9) + 5s), so the 5s calls
#   are all refused; shorter frames only make the next hops heard sooner, still
#   before 25s. The log counts unchanged (31, 7, 2). Every other scalar equal to
#   Plain's, now event #36346.
# FALSIFIER: any static:* number that moves, or a flood scalar unlike Plain's.
# RESULT (2026-10-13): held; static:* 20 / 9 / 11 / 0, one one-hop route
#   replaced, 8 entries checked and 0 wrong, the update applied; log 31 / 7 / 2;
#   event #36346, 0 scalars differing from Plain. Loop GREEN, invariants GREEN on
#   both configs, type and leak checks GREEN (0 of 3472 deliveries waiting).
# ---------------------------------------------------------------------------
[Config Static]
description = "StaticRoutes: fixed route entries through addEntry"
*.sink.generic.typename    = "StaticRoutesNetworkLayer"
*.sensor*.generic.typename = "StaticRoutesNetworkLayer"
*.sensor1.generic.np.routes = "sink:sensor2"
*.sensor1.generic.np.update = "sink:sensor4"
*.sensor1.generic.np.updateAt = 30s
*.sensor2.generic.np.routes = "sink:sensor5"
*.sensor3.generic.np.routes = "sink:sensor6 sensor5:sensor6"
*.sensor4.generic.np.routes = "sink:sensor5"
*.sensor5.generic.np.routes = "sink:sensor6"
*.sensor6.generic.np.routes = "sink:sink"
*.sensor7.generic.np.routes = "sink:sensor5"
*.sensor8.generic.np.routes = "sink:sensor6"
