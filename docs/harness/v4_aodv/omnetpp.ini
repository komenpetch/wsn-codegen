# Structure 4 with the AODV split (EbWsn) on the old SensorScope field.
#
# WHY THIS HARNESS EXISTS: the v4 AODV plan (design/V4_AODV_Plan.md, settled
# 2026-10-18): the RTMCS case study on structure 4 -- the generated module from
# C0_project with `--v4 --routing aodv`, plus AODV logic ported from INET's
# Aodv.cc as pasted test code (later steps). No DATA. The field is
# ../v4_mintroute's (plan Q5).
#
# [General] is ../v4_mintroute's [General]: the field, radio, MAC and queue
# every v4 MintRoute measurement was taken on, EXCEPT THE LINK RATE: 250 kbps
# here since 2026-10-19 (plan Q26 b; the reasons are at the bitrate lines).
# Everything recorded below before that date was measured at 19.2 kbps and its
# files are in results_19k2/.

[General]
network = SensorScopeNetwork
sim-time-limit = 60s

**.hasIpv4 = false
**.hasGn   = true
*.visualizer.osgVisualizer.typename = ""

# No apps (no DATA in v4).
*.sensor*.numApps = 0
*.sink.numApps    = 0

*.sink.generic.np.sinkAddress    = "sink"
*.sensor*.generic.np.sinkAddress = "sink"

# ---- Radio: verbatim from ../v4_mintroute, except the bitrate ----
# THE LINK RATE IS 250 kbps, NOT ../v4_mintroute's 19.2 kbps (plan Q26 b, user,
# 2026-10-19), for v4 and the baseline alike: the radio's rate and SMAC's.
# SMAC's own rate only times its frames (the NAV/duration fields and the
# interface datarate, Smac.cc:152/386/405/440/689; its contention windows are
# set in seconds), so the two must move together. Why: at 19.2 kbps INET's
# AODV (52 B frames, v4's are 10 B) collapses on this field and the baseline has
# almost no routes to compare (see [Config Baseline]). 250 kbps is IEEE
# 802.15.4's rate in this radio's 2.4 GHz band. ⚠ The thesis's MiXiM runs used
# 82944 bps (archive/MintRouteProj/MintRouteProj/omnetpp.ini), neither rate.
# WHAT THE RATE CHANGES, checked before the change:
#  - Not the links. Range is set by the -85 dBm sensitivity (259.2 m). At the
#    range edge the SNIR over the -110 dBm noise is 25 dB, and BPSK's bit
#    error rate 0.5*erfc(sqrt(SNIR*B/R)) (BpskModulation.cc:27) is 0 at either
#    rate. Measured: Control at 250 kbps decodes 88 x degree on every node and
#    every fired: counter equals the 19.2 kbps run's.
#  - Capture when frames overlap. B/R falls from 146 to 11.2 (Eb/N0 -11 dB): a
#    90 B frame survives down to the -8 dB snirThreshold at 19.2 kbps but needs
#    about 0 dB at 250 kbps (PER 8e-4 at 0 dB, 0.64 at -4 dB). Frames are 13
#    times shorter, so they overlap less.
# To rerun at 19.2 kbps, add to the command line:
#   '--**.radio.transmitter.bitrate=19200bps' '--**.wlan[*].mac.bitrate=19200bps'
**.wlan[*].typename                   = "WirelessInterface"
**.wlan[*].radio.typename             = "ApskScalarRadio"
**.radio.centerFrequency              = 2.45GHz
**.radio.bandwidth                    = 2.8MHz
**.radio.transmitter.bitrate          = 250kbps
**.radio.transmitter.power            = 2.24mW
**.radio.transmitter.headerLength     = 8b
**.radio.transmitter.preambleDuration = 0.0001s
# ⚠ -85dBm, NOT -100dBm (MyWSN's). At -100dBm every node hears every other one
# and the four-hop field collapses into a mesh. Check `attr configname` and the
# PER-MODULE sensitivity line in the .sca before reading any result here.
**.radio.receiver.sensitivity         = -85dBm
**.radio.receiver.energyDetection     = -90dBm
**.radio.receiver.snirThreshold       = -8dB
**.maxTransmissionDuration            = 100ms
*.radioMedium.backgroundNoise.power   = -110dBm

# ---- MAC + queue: verbatim from ../v4_mintroute, except the bitrate (above) ----
**.wlan[*].mac.typename         = "Smac"
**.wlan[*].mac.listenDuration   = 0.3s
**.wlan[*].mac.frameDuration    = 1s
**.wlan[*].mac.allowedDrift     = 0.03s
**.wlan[*].mac.bitrate          = 250kbps
**.wlan[*].mac.headerLength     = 72b
**.wlan[*].mac.ctrlFrameLength  = 160b
**.wlan[*].mac.queueLength      = 10
**.wlan[*].queue.typename       = "DropTailQueue"
**.wlan[*].queue.packetCapacity = 20

*.configurator.addStaticRoutes  = false
*.configurator.addDefaultRoutes = false
*.configurator.addSubnetRoutes  = false

# ---------------------------------------------------------------------------
# [Config Control] -- plan step 1: the generated module as it is (wsn-codegen
# 3f68fb5, `npm run generate -- AppLayer <dir> --v4 --routing aodv`), with the
# plan's settings that need no test code: the sink outside Dests (A1), the
# sensors' RREQ timer at 5 s, the sink's RREQ timer and every RREP/RRER timer
# off. With no test code the RREQ timer creates an RREQ on every tick (the
# "only without a route" check is test code, step 2).
#
# The old field's links (−85 dBm, 259.2 m): degrees sink 1, sensor1 2,
# sensor2 5, sensor3 3, sensor4 4, sensor5 6, sensor6 4, sensor7 4, sensor8 3;
# 16 links, 32 directed.
#
# PREDICTION (written before the first run), if no frame is lost:
#   create_rreqPkt 11 on every sensor (first at uniform(0.1,0.9)+5s, then every
#     5s, last near 55.x s), 0 on the sink: 88 in total. create_rrepPkt and
#     create_rrerPkt 0 (their timers are off). dest_recv_pkt 0 (Dests empty).
#   Every node outside Dests transmits each RREQ once, the sink included:
#     start_tx_controlPkt = send_down = 88 on every node, 792 in total; MAC
#     nbTxDataPackets 792.
#   Each node hears each RREQ once from each neighbour: send_up = MAC Rx =
#     88 x degree = sink 88, s1 176, s2 440, s3 264, s4 352, s5 528, s6 352,
#     s7 352, s8 264; 2816 in total. receive_controlPkt 77 on each sensor (the
#     others' RREQs) and 88 on the sink: 704. receive_dup_controlPkt the rest:
#     2112. update_nbr = send_up.
#   add_newEntry = degree on every node: 32 (the sink is heard, A1).
#   Queue overflow 0 (fewer sends than V4's 896 on this field, which had 0).
#   The log shows 32 one-hop routes.
# FALSIFIER: a sensor with create_rreqPkt other than 11, or the sink with any;
#   any RREP or RRER created; a node whose send_up differs from its MAC Rx; a
#   node transmitting more than 88. Lost frames (MAC Rx below 88 x degree) are
#   reported, not a falsifier.
# RESULT (2026-10-18, event #31421, -85 dBm on all nine radios): held for every
#   model counter, exactly. create_rreqPkt 11 on each sensor, none on the sink,
#   no RREP or RRER; start_tx_controlPkt = send_down = 88 on every node (792);
#   send_up = MAC Rx = 88 x degree on every node (2816), no frame lost;
#   receive_controlPkt 77 / 88, receive_dup_controlPkt 2112; update_nbr 2816;
#   add_newEntry = degree (32); dest_recv_pkt 0; queue overflow 0; 32 one-hop
#   routes, none through another node. ⚠ One prediction was mine and wrong:
#   MAC nbTxDataPackets is 90-93 per node (816), not 792. The module handed
#   down exactly 88 each (queue in = out = 88); SMAC re-sends a broadcast after
#   a failed contention, as recorded on 2026-09-22 (macTx <= send_down was a
#   wrong invariant then too).
#
# STEP 2a, THE AODV NAMES TABLE (2026-10-19, wsn-codegen 3f68fb5 + the change,
# uncommitted): the RREQ path takes INET AODV's names -- startRouteDiscovery
# (the RREQ timer's target), sendRREQ, handleRREQ, createRREQ (the model event
# create_rreqPkt; try_create_rreqPkt and fired:create_rreqPkt keep the label).
# PREDICTION: renames only, so every scalar equals the run above (#31421).
# RESULT: held; 618 of 618 scalars equal, event #31421; clang 0 errors.
# (Both runs above at 19.2 kbps; files in results_19k2/.)
#
# AT 250 kbps (plan Q26 b, 2026-10-19). PREDICTION (written before the harness
#   run, from the scratch run that checked the change, same build, same
#   settings): event #26590, every scalar equal to that run. Against 19.2 kbps:
#   every fired: counter equal; MAC Rx = 88 x degree on every node (no frame
#   lost, the same 32 directed links); MAC nbTxDataPackets 88 on every node
#   (SMAC's re-sends after a failed contention gone: nbContendFail 137-466,
#   was 244-1187); queue overflow 0.
# FALSIFIER: any scalar differing from the scratch run, or any fired: counter
#   differing from the 19.2 kbps run.
# RESULT (2026-10-19): held. Event #26590, 618 of 618 scalars equal to the
#   scratch run; no fired: counter differs from the 19.2 kbps run; MAC Rx =
#   88 x degree and MAC Tx = 88 on every node; invariants.sh GREEN.
# ---------------------------------------------------------------------------
[Config Control]
description = "generated structure 4, AODV split, no test code; plan settings"
*.sink.generic.typename    = "EbWsnNetworkLayer"
*.sensor*.generic.typename = "EbWsnNetworkLayer"
*.sink.generic.np.inDests  = false
*.sensor*.generic.np.rreqFloodsInterval = 5s
*.sink.generic.np.rreqFloodsInterval    = 0s
**.generic.np.rrepFloodsInterval = 0s
**.generic.np.rrerFloodsInterval = 0s
**.generic.np.headerLength = 80b

# ---------------------------------------------------------------------------
# [Config Route360] -- plan step 2b: the AODV test code (RREQ and RREP, ported
# from INET's Aodv.cc; ../../scratch/v4_aodv_2026-10-19/paste_aodv/) pasted into
# the generated files and switched on. Control's settings; 360 s; five runs,
# seed sets 0-4. Checked by route.mjs.
#
# STEP 2b'S REGRESSION: with aodv = false the pasted module must behave as
# generated, so Control on the edited files equals Control above, all 618
# scalars (event #31421).
#
# PREDICTION (written before the first run):
#   Each sensor's first RREQ tick (5.1-5.9 s) starts a discovery: an RREQ the
#   model floods (every node forwards it once, the sink included), the sink
#   answers each with an RREP, and the RREP is unicast back hop by hop along
#   the reverse route. Every sensor has an active route to the sink well
#   before 30 s, and keeps it to 360 s (nothing expires, nothing fails).
#   The next hops are the old field's shortest paths: sensor6 -> sink;
#   sensor3, sensor5, sensor8 -> sensor6; sensor2 -> sensor3 or sensor5;
#   sensor4 -> sensor5; sensor7 -> sensor5 or sensor8; sensor1 -> sensor2 or
#   sensor4 (a RREQ's first copy comes the fewest hops, about 10 ms a hop).
#   With every RREP in time: one discovery and one RREQ per sensor (8 in
#   total, none on the sink), 8 RREPs sent by the sink, 12 forwarded (the
#   sum of hops minus one per sensor), no discovery cancelled, addEntry never
#   refused, INET's route to the sink via the next hop on all eight, no RREP
#   or RRER creating event, no DATA event. The five seeds may differ only on
#   ties between equally short next hops.
# FALSIFIER: route.mjs RED in any run. A retry (more RREQs than 8) is not a
#   falsifier but would mean the 2.96 s wait is short for SMAC's unicast;
#   report it with the RREP latency.
# RESULT (2026-10-19, first run; events #45736 #32068 #37264 #35354 #35363):
#   FALSIFIED. Run #0 GREEN; runs #1-4 RED, every FAIL the same kind: INET's
#   route to the sink not via the AODV next hop (sensor2 in #1; sensor1, 2, 4, 7
#   in #2; sensor4 in #3; sensor1, 7 in #4). Held: every sensor has an active
#   route to the sink in all five runs, every next hop heard, every chain
#   reaches the sink, addEntry never refused, no RREP/RRER creating event, no
#   DATA event, the sink starts no RREQ. Did not hold:
#   (a) RREQs originated 35 / 12 / 25 / 18 / 22, not 8. The wait (2.96 s) is
#       short for SMAC's unicast: an RREP takes 0.65 s a hop on average, up to
#       4.0 s (27 hops measured in #1), so discoveries time out and retry.
#   (b) Some routes are longer than the shortest path (#1 sensor1 5 hops,
#       sensor2 4; #3 sensor4 4), and #3 sensor1's recorded hop count is 4
#       while its chain is 5.
#   CAUSE OF THE RED, traced (#1 at detail level): my test code changed AODV
#   routes in handleRREP, and after the delivery round in handleRREQ, and the
#   generated publishRoutes() runs only at the end of a delivery round, so a
#   change after a node's last RREQ arrival never reached INET's table
#   (sensor2: published via sensor3 at 7.11 s, AODV moved to sensor7 at 21.10 s,
#   its last RREQ arrival 15.14 s). INET changes its table where AODV changes a
#   route (Aodv.cc:1006 addRoute, 713-714 setNextHop), so createRoute and
#   updateRoutingTable now call publishRoutes() after a successful addEntry.
#
# PREDICTION (the publication fix, written before the rerun): publishing makes
#   no simulation event, so every run ends on the same event (#45736 #32068
#   #37264 #35354 #35363) and every scalar is unchanged except
#   aodv:inetRouteOk, now 1 on all eight sensors in all five runs: GREEN x5.
#   (a) and (b) stay as they are.
# FALSIFIER: a different event number or any other scalar changed (publishing
#   would then have changed behaviour), or any inetRouteOk still 0.
# RESULT (2026-10-19): held exactly. Same five events; the only scalars that
#   changed are aodv:inetRouteOk 0 -> 1, on exactly the nine nodes that had
#   failed (836-838 per run otherwise equal); route.mjs GREEN x5. Control on the
#   rebuilt files = step 1's run, 618 of 618.
#
# THE SINK'S SEQUENCE NUMBER, (b) above, traced and then proved by a
#   counterfactual (scratch only, not adopted). The sink's sequenceNum ends at
#   3 / 2 / 1 / 2 / 1, where in INET it would stay 0 here (nothing breaks). The
#   chain: the model floods every RREQ, the sink included (A1), but INET's
#   destination never forwards a RREQ addressed to it (Aodv.cc:907). sensor6,
#   the sink's only neighbour, receives that copy and sets its previous-hop
#   route to the sink with the RREQ ORIGINATOR's sequence number (Aodv.cc:790,
#   793); its later RREQs carry max(that, ...) as the destination sequence
#   number (965); the sink raises its own when that equals its number + 1
#   (460-461). Fresher RREPs then replace shorter routes (rule (ii)), hence the
#   longer routes. Counterfactual: the AODV code ignores a RREQ whose sender is
#   its own destination (the model's round unchanged). Predicted and held: the
#   sink's number 0 in all five runs, every route's 0, the same five events,
#   RREQ/RREP counts unchanged, every route a shortest path, every chain equal
#   to its hop count.
#
# ADOPTED (user, Q25 b, 2026-10-19): handleRREQ ignores a RREQ whose sender is
#   its own destination, and counts it (aodv:rreqFromDestIgnored). Checked
#   first, on the counterfactual's runs: rreqFieldsMissing 0 in all five; the
#   sink's only neighbour is sensor6, which always sent the RREQ to the sink
#   first, so every ignored copy is a duplicate the model drops and never
#   forwards. ⚠ Limit: on a field where a node can hear a RREQ from the sink
#   before any other copy, the model would forward that copy without its AODV
#   fields; route.mjs fails on rreqFieldsMissing, so it cannot pass silently.
# PREDICTION (written before the run): the counterfactual's behaviour exactly,
#   since only a comment and a counter differ from it: the same five events,
#   every scalar equal to the counterfactual's runs, plus the new counter:
#   sensor6 = the RREQ frames from the sink it decoded, about the sink's
#   send_down (35/12/25/18/22; lower by losses, higher by SMAC re-sends), 0 on
#   every other node. route.mjs GREEN x5, every route a shortest path.
# FALSIFIER: any other scalar or event number differs from the counterfactual,
#   any node other than sensor6 ignores a copy, or route.mjs RED.
# RESULT (2026-10-19, edited files 9a1b7772/b318abef/bb773d41): held. The same
#   five events; every earlier scalar equal to the counterfactual's (838 / 836 /
#   838 / 838 / 838); only sensor6 ignores copies: 26 / 12 / 18 / 18 / 17.
#   route.mjs GREEN x5, every route a shortest path, the sink's sequence number
#   0. Control on these files = step 1, 618 of 618. invariants.sh GREEN on all
#   six runs; type_check.sh and leak_check.sh GREEN on #0 and #1 (0 of 1111 / 0
#   of 384 deliveries waiting).
#   ⚠ My "lower by losses" was wrong. sensor6 decoded all but 1-6 of the frames
#   its neighbours sent; the missing sink copies were never sent. THE SINK'S
#   QUEUE (packetCapacity 20) OVERFLOWED in #0, #2 and #4: 18 / 14 / 10 frames
#   dropped, in pairs at the same instant (one arrival queues the forwarded RREQ
#   and its RREP together), between 14 and 18 s. So 9 / 7 / 5 RREQ forwards and
#   as many RREPs never left, which is exactly the gap (35-26, 25-18, 22-17).
#   It happens in the three runs with the most RREQs (35/25/22; none at 12 and
#   18). The sink queues two frames per RREQ (its rebroadcast, A1, and its
#   RREP), and every unicast RREP needs sensor6 in an SMAC listen window. A
#   dropped RREP leaves a discovery to time out and retry, which adds RREQs;
#   which way the two drive each other is not separated. Reported, not gated
#   (route.mjs prints it).
#   (Everything in this block above was measured at 19.2 kbps; results_19k2/.)
#
# AT 250 kbps (plan Q26 b, 2026-10-19). PREDICTION (written before the runs):
#   #0 = the scratch probe of the same build and settings: event #29329, every
#   scalar equal. GREEN; every route a shortest path, all eight by 9.2 s
#   (sensor1 -> sensor2, sensor2 -> sensor5, sensor7 -> sensor5); 10 RREQs
#   (sensor1 and sensor7 retried once), 10 RREPs sent, 25 forwarded; the sink's
#   sequence number 0; no queue overflow; sensor6 ignores 10 RREQ copies from
#   the sink.
#   #1-#4 (not run before at this rate): route.mjs GREEN; every route a shortest
#   path (next hops may differ only at the three tie nodes: sensor1
#   sensor2|sensor4, sensor2 sensor3|sensor5, sensor7 sensor5|sensor8); the
#   sink's sequence number 0; every sensor routed before 20 s; 8-20 RREQs per
#   run (a retry where the RREP's hops outlast the 2.96 s wait, as in #0); no
#   queue overflow.
# FALSIFIER: route.mjs RED in any run, a route longer than the shortest path,
#   or the sink's sequence number above 0. More RREQs, a later route or
#   overflow would be reported, not a falsifier.
# RESULT (2026-10-19; events #29329 #26227 #30730 #28229 #31588): FALSIFIED on
#   one point. #0 = the probe, 847 of 847 scalars. route.mjs GREEN x5 (every
#   sensor routed through a heard neighbour, chains reach the sink, INET's
#   table agrees, addEntry never refused); the sink's sequence number 0; no
#   queue overflow; every sensor routed by 13.0 s; invariants.sh GREEN on all
#   five; type_check.sh and leak_check.sh GREEN on #0 (0 of 320 deliveries
#   waiting). Did not hold:
#   (a) A route longer than the shortest path: sensor4 4 hops (shortest 3) in #1
#       (via sensor7) and #3 (via sensor2).
#   (b) RREQs 10 / 6 / 14 / 10 / 16; #1's 6 is below my 8. In #1 sensor6, 7 and
#       8 started no discovery: each already had a route to the sink from an
#       RREP it forwarded for another sensor (5.17-5.21 s, before its first
#       tick), as INET gives every hop of an RREP a forward route.
#   CAUSE OF (a), traced (#1 and #3 to 15 s at detail level). Each node takes
#   its reverse route from the FIRST copy of an RREQ (originator, id) it hears;
#   a copy with a fresher originator sequence number replaces the reverse route
#   whatever its hop count. INET's AODV does the same (Aodv.cc:801-806 drops a
#   later copy before the reverse-route update at 859-872; 871). The RREP goes
#   back along that reverse route, so the originator's route is as long as the
#   path its RREQ's first copy took to sensor6.
#   #1: sensor4's first discovery set shortest reverse routes (sensor6 via
#   sensor5, 2 hops), but its RREP did not reach sensor4 within the 2.96 s
#   wait. The retry (9.009 s) carries a fresher sequence number. sensor5 put it
#   on the air last, at 9.032 s, 23.5 ms after receiving it and after five of
#   its neighbours had rebroadcast it; sensor6 had already taken the copy via
#   sensor7 and sensor8 (9.018 s), 3 hops.
#   #3: in sensor4's first discovery (6.03 s) several sensors' floods overlap;
#   sensor6 decoded two frames from sensor5 at 6.040 and 6.044 s that carried
#   other RREQs, and took sensor4's via sensor2 and sensor3 at 6.067 s.
#   What delayed sensor5 (its queue, its contention) is not logged, so not
#   measured. Why this never happened in the five 19.2 kbps runs is not
#   explained.
# ---------------------------------------------------------------------------
[Config Route360]
description = "the AODV test code: route discovery to the sink, 360 s, five runs"
extends = Control
**.generic.np.aodv = true
sim-time-limit = 360s
repeat = 5

# ---------------------------------------------------------------------------
# [Config Baseline] -- plan step 3 (Q11, A2, A3): INET's own AODV on the same
# field, radio, MAC and queue, as MyWSN's [Config AODV] sets it
# (inet4.5/MyWSN/omnetpp.ini): IPv4, no HELLO, no local repair, no gratuitous
# RREP, destination-only replies, a flat TTL of 35, rreqRetries 3, rate limits
# lifted, activeRouteTimeout 30 s. AODV starts a discovery only for a data
# packet with no route (Aodv.cc:185-238), so each sensor runs SensorApp to the
# sink: every 10 s (A2), first at exponential(1s), 10 B, as MyWSN. The node is
# BaselineAodvSensorNode (BaselineAodv.ned): MyWSN's AodvSensorNode with a
# recording subclass of INET's Aodv (libINET untouched). 360 s, five runs, seed
# sets 0-4 (A3). Checked by baseline_route.mjs; compare_aodv.mjs pairs each run
# with Route360's run of the same number.
#
# ⚠ THE NODES ARE SWAPPED BY A DERIVED NETWORK, NOT BY typename. The field
# declares `sink: SensorNode` (a concrete type), and a typename assignment
# applies only to a parametric submodule (`<...> like ...`; OMNeT++ 6.3 manual,
# "typename pattern assignments"). The first Baseline runs here set
# `*.sink.typename = "BaselineAodvSensorNode"`, and the .sca recorded every node
# as inet.node.inet.SensorNode with no aodv module: the line was ignored without
# a word. MyWSN's [Config AODV] (2026-06-05) does the same thing on a field
# declared the same way, and its AODV-#0.sca shows the same: plain SensorNode,
# no aodv module. So that run never ran AODV. SensorScopeAodvNetwork.ned is
# written by derive_baseline_net.mjs: SensorScopeNetwork.ned with the network
# renamed and the nine node types changed, nothing else (positions identical).
#
# PREDICTION (written before the first run):
#   Every sensor's first datagram starts a discovery for the sink. The RREQ is
#   flooded by every node except the sink, which answers and does not forward
#   (Aodv.cc:907); the RREP is unicast back along the reverse route, and every
#   node it crosses learns a route to the sink, so some sensors may never need a
#   discovery of their own.
#   - Every sensor holds an active route to the sink at 360 s in all five runs
#     (its own datagrams renew it every 10 s, well inside the 30 s timeout), its
#     next hop chain reaches the sink, no loop.
#   - Every route is a shortest path; the sink's sequence number stays 0 and
#     every route's destination sequence number is 0 (nothing breaks, and no
#     node ever hears a RREQ from the sink).
#   - No RERR (SMAC sends no link-break signal; routes are kept alive).
#   - No queue overflow at the sink: it sends one frame per RREQ (its RREP),
#     not two as in Route360. sensor6 carries every datagram to the sink
#     (8 sensors x 0.1/s); overflow there is possible and is reported.
#   - The sink receives at least 80 % of the DATA the sensors send (uncertain:
#     every datagram is an SMAC unicast and all of them cross sensor6).
#   - Against Route360 run for run: the same hop count on every sensor; the next
#     hop may differ only at the three tie nodes (sensor1: sensor2|sensor4,
#     sensor2: sensor3|sensor5, sensor7: sensor5|sensor8).
# FALSIFIER: a sensor without an active route at the end, a route longer than
#   the shortest path, the sink's sequence number above 0, an RERR, overflow at
#   the sink, delivery below 80 %, or a hop count differing from Route360's.
# RESULT (2026-10-19, events #364268 #337209 #360983 #372001 #369164; every
#   node a BaselineAodvSensorNode, checked in the .sca): FALSIFIED, badly.
#   INET's AODV collapses on this link. Active routes to the sink at 360 s: 2 /
#   4 / 3 / 2 / 2 of 8 sensors (sensor6 always, sensor8 in four runs); DATA
#   delivered 4 / 4 / 3 / 6 / 7 of 288 (1.0-2.4 %); RREQs originated 492 / 388
#   / 477 / 501 / 468, every sensor without a route exactly 72 (a discovery is 4
#   RREQs over 11.84 s, the datagram arriving during it waits, the next starts a
#   new one 20 s after the first: 360 / 20 x 4); queue overflow on every node
#   (up to 1470 frames). Held: no RERR, the sink's sequence number 0, every route
#   that exists a shortest path.
#   WHY, measured: (1) INET's AODV frames are 52 B at the queue (416 bits: RREQ
#   24 + UDP 8 + IPv4 20), v4's 10 B (80 bits) -- five times the airtime on a
#   19.2 kbps SMAC link. (2) The sink stalls on its unicast RREPs: #0 sink queue
#   219 in, 7 out, 192 dropped; MAC 352 RTS, 102 CTS, 15 ACK, 28 data frames --
#   sensor6 (1286 frames received) is buried in RREQ broadcasts from nodes the
#   sink cannot hear, and SMAC retries a unicast without limit. Route360 #0's
#   sink: 56 RTS, 27 CTS, 26 ACK. (3) Single-variable check (scratch, Route360
#   #0/#1 with --**.generic.np.headerLength=416b, v4 frames at 52 B): v4 shows
#   the same mechanism -- RREQs 184 / 422 (from 35 / 12), the sink's queue
#   stalled (260 in, 36 out), overflow on 6 / 5 nodes -- yet every sensor still
#   gets a route (late: 139 s, 303 s), because v4's routes never expire and it
#   carries no DATA. The baseline also expires routes after 30 s and restarts a
#   failed discovery for every new datagram, so it never recovers.
#   A SECOND DEFECT, in the node (mine, copied from MyWSN): IP forwarding was off.
#   NetworkLayerNodeBase defaults forwarding to false; INET's AodvRouter gets
#   true from AdhocHost (AdhocHost.ned:29); MyWSN's AodvSensorNode extends
#   SensorNode and never set it. Found by a probe at 250 kbps (below): routes on
#   every sensor, yet the relays dropped what they should forward (ipv4.ip
#   packetDropForwardingDisabled 40 / 109 / 108 at sensor2 / sensor5 / sensor6)
#   and the sink got 36 of 288. BaselineAodvSensorNode now sets forwarding = true.
#   RE-RUN with forwarding on (events #362899 #335368 #366607 #372001 #367896),
#   prediction written first, held: the collapse stays -- 2 / 3 / 2 / 2 / 2 of 8
#   sensors routed, DATA 4 / 11 / 3 / 6 / 7 of 288, RREQs 492 / 420 / 480 / 501
#   / 468, overflow on every node. The results/ Baseline files are these.
#   PROBE AT 250 kbps (scratch, #0, radio and SMAC bitrate on the command line):
#   every sensor routed on a shortest path (first routes 1.2-29.3 s), 27 RREQs,
#   the sink's sequence number 0, no RERR, overflow only sensor6 = 13, and the
#   sink received 295 for 288 sent. v4 Route360 #0 at 250 kbps: every sensor on
#   a shortest path by 9.2 s, 10 RREQs, no overflow. So INET's AODV runs on this
#   field at 250 kbps and not at 19.2 kbps.
#   ⚠ Two things I wrote about this probe were wrong, corrected after tracing:
#   (1) "the links do not change, reception depends on power and bandwidth":
#   the bit error rate depends on the bitrate too (see [General]); the link SET
#   does not change, measured, but capture under overlap does. (2) "7 more than
#   sent": a net figure. Traced with event banners (same run, same event
#   #147664): 276 distinct datagrams arrived, 17 of them more than once (19
#   extra copies), and 12 never arrived (all among the sensors' first five,
#   while routes formed; sensor6's queue dropped 13 frames, 12 of them at
#   37-45 s, and 3 ARP resolutions failed; which frames were lost is not
#   separated). The copies come from SMAC: it keeps a unicast frame until its
#   ACK arrives (Smac.cc:554) and Smac::receiveData passes every frame addressed
#   to it up with no duplicate test (the header's sequenceId is set, never
#   read), so a frame whose ACK is lost is delivered again when it is re-sent;
#   IPv4 forwards both and SensorApp counts both. In the 4 of the 17 read one by
#   one, the overhearing neighbours show the same sender putting the frame on
#   the air twice; sensor6's IPv4 forwarded each datagram it received once (262
#   from the network + 36 of its own = 298 sent). The other 13 were not traced
#   to their link. With protocolWaitDelay 0 the ACK wait has no timer, so
#   nbMissedAcks stays 0 although ACKs are lost.
# DECIDED (user, Q26 b, 2026-10-19): the AODV harness runs at 250 kbps, v4 and
#   the baseline alike ([General]). The 19.2 kbps runs above are in
#   results_19k2/.
#
# AT 250 kbps. PREDICTION (written before the runs):
#   #0 = the probe (same build and settings): event #147664, every scalar
#   equal. Every sensor holds an active route to the sink at 360 s on a
#   shortest path; 27 RREQs; the sink's sequence number 0; no RERR; overflow
#   only sensor6 = 13; the sink's SensorApp counts 295 (copies included).
#   #1-#4 (not run before at this rate): every sensor an active route at 360 s,
#   its chain reaching the sink, a shortest path; the sink's sequence number and
#   every route's 0; no RERR; the sink counts at least 90 % of the 288 sent
#   (copies included); 15-60 RREQs per run; overflow, if any, at sensor6 while
#   routes form.
#   Against Route360 run for run (compare_aodv.mjs): the same hop count on every
#   sensor in all five pairs; next hops may differ only at the three tie nodes
#   (in #0 they differ at all three: v4 sensor1 -> sensor2, sensor2 ->
#   sensor5, sensor7 -> sensor5; INET sensor4, sensor3, sensor8).
# FALSIFIER: a sensor without an active route at the end, a route longer than
#   the shortest path, the sink's sequence number above 0, an RERR, delivery
#   below 90 %, or a hop count differing from Route360's.
# RESULT (2026-10-19; events #147664 #123630 #123118 #123509 #129334):
#   FALSIFIED on two points, the same as Route360's. #0 = the probe, 846 of
#   846 scalars. Held: every sensor an active route to the sink at 360 s, its
#   chain reaching the sink, no loop; the sink's sequence number and every
#   route's 0; no RERR; the sink counts 295 / 292 / 293 / 295 / 296 of 288
#   (copies included); RREQs 27 / 22 / 31 / 31 / 23; overflow only #0 sensor6
#   = 13. Did not hold:
#   (a) Routes longer than the shortest path: sensor4 4 hops in #1 (via
#       sensor2), sensor7 4 hops in #4 (via sensor2). In #3 sensor1's recorded
#       hop count is 5 while its chain is 4: the count is the one its RREP
#       carried, and its next hop's route changed after.
#   (b) Against Route360 (compare_aodv.mjs): the same hop count on 37 of 40
#       sensor routes, not 40 (#3 sensor1 4 | 5, the recorded count above; #3
#       sensor4 4 | 3; #4 sensor7 3 | 4); the same next hop on 29 of 40. In #1
#       sensor4 is 4 hops on both sides, through different next hops.
#   The cause is the AODV rule traced in Route360's RESULT (the first copy of
#   an RREQ sets the reverse route); the baseline's long routes were not traced
#   one by one.
# ---------------------------------------------------------------------------
[Config Baseline]
description = "INET AODV (MyWSN [Config AODV]) + SensorApp every 10 s: the baseline, 360 s, five runs"
network = SensorScopeAodvNetwork
sim-time-limit = 360s
repeat = 5
**.hasIpv4 = true
**.hasGn   = false

*.sensor*.numApps                = 1
*.sensor*.app[0].typename        = "SensorApp"
*.sensor*.app[0].sinkAddress     = "sink"
*.sensor*.app[0].sensingInterval = 10s
*.sensor*.app[0].startTime       = exponential(1s)
*.sensor*.app[0].payloadLength   = 10B
*.sensor*.app[0].networkProtocol = "ipv4"
*.sink.numApps                   = 1
*.sink.app[0].typename           = "SensorApp"
*.sink.app[0].sinkAddress        = ""
*.sink.app[0].networkProtocol    = "ipv4"

# MyWSN [Config AODV], verbatim.
**.aodv.useHelloMessages    = false
**.aodv.useLocalRepair      = false
**.aodv.askGratuitousRREP   = false
**.aodv.destinationOnlyFlag = true
**.aodv.rreqRatelimit = 1000
**.aodv.rerrRatelimit = 1000
**.aodv.rreqRetries   = 3
**.aodv.netDiameter  = 35
**.aodv.ttlStart     = 35
**.aodv.ttlIncrement = 0
**.aodv.ttlThreshold = 35
**.aodv.activeRouteTimeout = 30s
**.aodv.nodeTraversalTime  = 0.04s

# ===========================================================================
# STEP 4 (plan §9; Q10, Q13-Q16, Q20): HELLO, the lost-link rule, RERR and the
# node failure test, added to the AODV test code (paste_aodv, 2026-10-19).
# Ported from Aodv.cc: createHelloMessage, sendHelloMessagesIfNeeded,
# handleHelloMessage (1342-1435), handleLinkBreakSendRERR, createRERR,
# handleRERR (1040-1206); the lost-link rule INET leaves as a TODO
# (1427-1434, RFC 3561 6.9) implemented as quoted there; the failure switch
# copied from MintRoute's test code. HELLO sits behind INET's own switch
# useHelloMessages, default false as in MyWSN, so Route360 and the baseline
# stay as they were measured and like for like.
#
# FACTS READ BEFORE THE PREDICTIONS (INET source):
#  - HELLO is an RREP with no originator (Aodv.cc:556-559, 1342-1365).
#  - The HELLO timer fires every helloInterval - jitter (jitter uniform(0,
#    helloInterval/4), Aodv.ned:44-45), and a HELLO goes out only if the node
#    has an active route and its last broadcast is MORE than helloInterval ago
#    (1390). So after a HELLO the next tick (3.75-5 s later) skips and the one
#    after sends: with no other broadcast a node sends a HELLO every 7.5-10 s,
#    not every 5 s.
#  - The rule declares a neighbour lost after ALLOWED_HELLO_LOSS x
#    HELLO_INTERVAL = 10 s without any packet from it, if a HELLO was heard
#    from it within DELETE_PERIOD (5 x max(30 s, 5 s) = 150 s).
#  - SMAC sends a frame only in a listen window (0.3 s of every 1 s), so a frame
#    handed down in the sleep part waits up to 0.7 s. At a receiver the gap
#    between two HELLOs is 7.5-10 s plus up to +-0.7 s, which can pass 10 s with
#    nothing lost: a FALSE link break. Estimated (sender gap 10 - J1 - J2,
#    J uniform(0, 1.25 s), delay difference triangular on +-0.7 s): about 1 % of
#    gaps, ~1280 gaps per 360 s run (32 directed links x ~40), so on the order
#    of 10 false breaks per run before any HELLO is lost. Not measured yet.
#  - A link break invalidates every route through the lost neighbour and
#    broadcasts an RERR (1040-1125); a node receiving it invalidates its routes
#    whose next hop sent it and passes the RERR on only for routes with a
#    precursor (1147-1206). An invalid route is AODV's alone: the model's table
#    and INET's keep the old next hop until a new RREP replaces it (Q15). The
#    next RREQ tick of a sensor without a valid route starts a discovery.
#
# REGRESSION PREDICTION (written before the rebuild's first run): with
#   useHelloMessages false and failAt -1 nothing here acts. Control = the
#   250 kbps run, 618 of 618 (aodv false: no aodv scalars). Route360 = the
#   250 kbps runs, the same five events and every earlier scalar equal; new
#   scalars only: aodv:helloSent/helloReceived/rerrSent/rerrReceived/
#   linkBreaks 0 and aodv:failed 0 on every node, no event-list scalar
#   (aodv:breakAt:k, rerrAt:k, sinkRouteAt:k), and on every sensor
#   aodv:inetSinkRoutes 1 and aodv:inetSinkNextHop = aodv:nextHop.
# FALSIFIER: any earlier scalar or event number differs, or a new counter is
#   not 0.
# RESULT (2026-10-19): held, twice. First on a version recording last-of-kind
#   times (Control 618 of 618; Route360 the same five events, 0 earlier scalars
#   changed, INET's next hop = AODV's on all 40 sensor routes); then on this
#   version, with event lists so that an RERR after the failure can be told
#   from one before it (see below).
#
# [Config Hello360] -- Route360 with HELLO on (Q20: helloInterval 5 s,
#   allowedHelloLoss 2), no failure: is the lost-link rule quiet when nothing
#   fails? Five runs, seed sets 0-4. Checked by route.mjs and fail.mjs.
# PREDICTION (written before the first run): the jitter is drawn at time 0, so
#   every random draw after it differs from Route360's and the runs are not
#   comparable event for event. Routes form as in Route360 (route.mjs's checks
#   hold at 360 s, every sensor routed by ~15 s). Every node sends HELLOs from
#   its first tick after it has an active route: 35-48 each, at intervals of
#   7.5-10 s when it broadcasts nothing else. False link breaks: some, from the
#   estimate above (order 10 per run); each one sends an RERR, and a sensor
#   whose route to the sink went through the "lost" neighbour rediscovers on
#   its next tick. route.mjs may then still be GREEN (a route is usually back
#   within ~5-15 s), unless a break falls in the last seconds.
# FALSIFIER of the estimate: no false break in any of the five runs, or many
#   more than ~30 in a run.
#
# [Config FailSensor5], [Config FailSensor6] -- Hello360's settings, sensor5 or
#   sensor6 failed at 150 s (failAt; its MAC keeps running), 600 s, one run
#   (Q16). Checked by fail.mjs (plan §8).
# PREDICTION, FailSensor5 (written before the first run): sensor5's
#   neighbours (sensor2, 3, 4, 6, 7, 8) declare it lost 10 s after its last
#   frame, between 150 and ~161 s; every route through it is invalidated and
#   RERRs go out (at least one after 150 s). A sensor whose route went through
#   sensor5 rediscovers on its next tick and holds a new route by ~180 s.
#   At 600 s: every living sensor holds a valid route, no route and no chain
#   goes through sensor5, no loop; sensor4 is 4 hops (sensor2 or sensor7), the
#   rest at their shortest. INET's table keeps the old next hop from the
#   invalidation until the new route (reported). False breaks as in Hello360,
#   before and after 150 s (reported).
# PREDICTION, FailSensor6: sensor6's neighbours (sink, sensor3, 5, 8) declare
#   it lost between 150 and ~161 s; RERRs carry the loss on along the
#   precursors, so every living sensor's route to the sink is invalidated by
#   ~165 s (by a lost link or an RERR). No discovery can succeed after that
#   (sensor6 is the sink's only neighbour): each living sensor runs a
#   discovery of 4 RREQs over 11.84 s, then a new one on a tick 0-5 s later,
#   so about 120 RREQs each in the 450 s after the failure. At 600 s no sensor
#   holds a valid route; INET's table still holds the old route on every
#   sensor (stale, reported). ⚠ Risk named before the run: an RERR is one
#   broadcast, never repeated, and nothing expires here (Q6); a sensor that
#   misses the RERR of its next hop keeps a valid route for ever. That would
#   fail the test, and would be AODV-without-expiry behaviour, not a bug.
# FALSIFIER: fail.mjs RED (its conditions are plan §8's).
#
# RESULTS (2026-10-19; edited files 7d7406d7/d534897a/c0d7e1d7).
# Hello360 (events #41296 #40055 #50960 #41320 #55305): route.mjs GREEN x5;
#   HELLOs 322-355 per run (36-39 a node), held. ⚠ FALSE LINK BREAKS, as
#   estimated in size but not in kind: 26 / 13 / 34 / 15 / 19 declarations,
#   from 7 / 3 / 8 / 5 / 5 events. In all but one event EVERY neighbour of one
#   node declares it lost at the same instant (#0 45.01 s: sensor1, 2, 5, 7 all
#   lose sensor4), so it is the sender's gap, not a loss on one link: a
#   broadcast reaches all neighbours at once, which my per-receiver estimate
#   ignored. Traced (#0, sensor4): HELLOs at 26.11, 34.60, 44.33 s (8.5-9.7 s
#   apart, INET's two ticks); the 34.60 one reached sensor7 at 35.013 s (SMAC
#   waited 0.41 s for a listen window); the 44.33 one was handed down just
#   after a window closed and waited for the 45.00 s window; the neighbours'
#   deadline, 35.013 + 10 = 45.013 s, fell first. Nothing was lost. The one
#   single-receiver event (#3 305.02 s, sensor1 alone loses sensor4) is likely
#   a lost frame. Cost: RERRs 14-39 and RREQs 11-37 per run (Route360: 6-16).
# FailSensor5 (event #68236): GREEN. sensor5 declared lost by all six
#   neighbours at 160.01 s, 10 s after its last frame; 27 RERRs after the
#   failure; sensor4 and sensor7 rerouted through sensor2 by 163.0 / 162.1 s;
#   at 600 s every living sensor routed, no chain through sensor5, no loop.
#   ⚠ "the rest at their shortest" did not hold: sensor7 is 4 hops via sensor2,
#   where 3 via sensor8 exists (the first-copy effect traced for Route360). 20
#   false breaks (the same mechanism), 6 real.
# FailSensor6 (event #219435): GREEN. sensor6 declared lost by the sink,
#   sensor3, 5, 8 at 158.01 s (its last frame 148.01 s); RERRs reached sensor1,
#   2, 4, 7 by 158.03 s; at 600 s no sensor routed; 118-120 RREQs each, held;
#   INET's table still routes to the sink on all seven (stale), held. HELLOs
#   fall to 16-18 a node after the failure (the RREQs are broadcasts).
# Checks: invariants.sh (I4, I5 restated with HELLOs and RERRs) GREEN on all
#   13 runs (Control, Route360 x5, Hello360 x5, both failures), RED on a copy
#   with one HELLO added to sensor3's count (I4, sensor3 only). type_check.sh
#   and leak_check.sh GREEN on FailSensor5 #0 (#68236, 0 of 556 deliveries
#   waiting) and Hello360 #0 (#41296, 0 of 384); staged module restored by md5.
# PROBE (scratch, command line only): allowedHelloLoss = 3 (a 15 s limit).
#   Hello360 x5: 0 link breaks, 0 RERRs, RREQs 5-12, route.mjs GREEN x5.
#   FailSensor5: GREEN, sensor5 noticed at 164.03 s (15 s), 0 false breaks, 7
#   RERRs, 11 RREQs. FailSensor6: GREEN, noticed at 158.01 s. So the false
#   breaks at 10 s come from the timing alone. Which limit the harness keeps is
#   put to the user (2026-10-19).
#   (The results above, at allowedHelloLoss 2, are in results_loss2/; to rerun
#   one add '--**.generic.np.allowedHelloLoss=2'.)
#
# DECIDED (user, Q27 b, 2026-10-19): allowedHelloLoss = 3, a 15 s silence
#   limit, set in [Config Hello360] (the failure configs inherit it). Checked
#   first: in INET the parameter only sets a HELLO's lifetime (Aodv.cc:1362,
#   1417); nothing expires here, so it acts only in the lost-link rule;
#   DELETE_PERIOD does not depend on it (150 s); Aodv.ned:57's constraint,
#   activeRouteTimeout > allowedHelloLoss x helloInterval, holds (30 > 15 s).
#   The longest gap the timing allows at a receiver is two ticks of at most 5 s
#   plus at most 0.7 s of SMAC wait, about 10.7 s, under 15 s. ⚠ LIMIT: one
#   lost HELLO (with no other frame from that neighbour) still leaves 15-20 s
#   of silence, so it is still declared a lost link: the RFC's 2 tolerates one
#   loss with HELLOs every HELLO_INTERVAL, INET's timing sends them half as
#   often, and 3 does not restore that. No such loss in the probes (5 x 360 s,
#   2 x 600 s). Q20's "break noticed in 10 s" becomes 15 s.
# PREDICTION (written before the runs): the configured runs are the probes,
#   since only where the value is set changes: Hello360 events #37030 #35901
#   #37018 #39993 #37671, FailSensor5 #59982, FailSensor6 #217735, every
#   scalar equal to the probe's. So: Hello360 route.mjs GREEN x5 with 0 link
#   breaks and 0 RERRs; FailSensor5 GREEN (sensor5 noticed at 164.03 s, 0
#   false breaks); FailSensor6 GREEN (noticed at 158.01 s).
# FALSIFIER: any event number or scalar differing from the probe.
# RESULT (2026-10-19): held. The same seven events; every scalar equal to the
#   probe's (914-917 per Hello360 run, 947 and 938); allowedHelloLoss 3 on
#   every node. Hello360: route.mjs GREEN x5, 0 link breaks, 0 RERRs, 5-12
#   RREQs, 39-41 HELLOs a node. FailSensor5: GREEN, sensor5 declared lost by
#   all six neighbours at 164.03 s, 7 RERRs, sensor1 / 4 / 7 routed again by
#   168.24 / 168.09 / 168.02 s. FailSensor6: GREEN, noticed at 158.01 s, every
#   sensor's route lost by 158.03 s, 118-120 RREQs each, INET's table stale on
#   all seven. Still longer than possible (the first-copy effect): FailSensor5
#   sensor1 5 hops via sensor4 (4 via sensor2 exists); Hello360 #4 sensor4 4
#   and sensor1 5 (its recorded hop count 4, its next hop's route changed).
#   invariants.sh GREEN on all seven; type_check.sh and leak_check.sh GREEN on
#   FailSensor5 #0 (#59982, 0 of 304 waiting) and Hello360 #0 (#37030, 0 of
#   224); staged module restored by md5.
# ===========================================================================
[Config Hello360]
description = "Route360 with HELLO (5 s x 3) and the lost-link rule, no failure: five runs, 360 s"
extends = Route360
**.generic.np.useHelloMessages = true
**.generic.np.helloInterval    = 5s
**.generic.np.allowedHelloLoss = 3   # Q27 b (2 gave false breaks, see above)

[Config FailSensor5]
description = "HELLO on, sensor5 fails at 150 s, 600 s"
extends = Hello360
sim-time-limit = 600s
repeat = 1
*.sensor5.generic.np.failAt = 150s

[Config FailSensor6]
description = "HELLO on, sensor6 (the sink's only neighbour) fails at 150 s, 600 s"
extends = Hello360
sim-time-limit = 600s
repeat = 1
*.sensor6.generic.np.failAt = 150s
