# Structure 4 with the DSR split (EbWsn) on the old SensorScope field.
#
# WHY THIS HARNESS EXISTS: the v4 DSR plan (design/V4_DSR_Plan.md, settled and
# audited 2026-10-24): the WBAN/DSR case study (HCMS) on structure 4 -- the
# generated module from C0_project with `--v4 --routing dsr`, plus DSR's route
# discovery as pasted test code (later steps), written from the thesis and the
# Final Report. No DATA. No baseline run: no DSR implementation exists.
#
# [General] is ../v4_aodv's [General], verbatim (plan Q5): the old field at
# -85 dBm, 250 kbps on the radio and SMAC (AODV plan Q26), the queue.
#
[General]
network = SensorScopeNetwork
sim-time-limit = 60s

**.hasIpv4 = false
**.hasGn   = true
*.visualizer.osgVisualizer.typename = ""

# No apps (no DATA in v4).
*.sensor*.numApps = 0
*.sink.numApps    = 0

*.sink.generic.np.sinkAddress    = "sink"
*.sensor*.generic.np.sinkAddress = "sink"

# ---- Radio: verbatim from ../v4_mintroute, except the bitrate ----
# THE LINK RATE IS 250 kbps, NOT ../v4_mintroute's 19.2 kbps (plan Q26 b, user,
# 2026-10-19), for v4 and the baseline alike: the radio's rate and SMAC's.
# SMAC's own rate only times its frames (the NAV/duration fields and the
# interface datarate, Smac.cc:152/386/405/440/689; its contention windows are
# set in seconds), so the two must move together. Why: at 19.2 kbps INET's
# AODV (52 B frames, v4's are 10 B) collapses on this field and the baseline has
# almost no routes to compare (see [Config Baseline]). 250 kbps is IEEE
# 802.15.4's rate in this radio's 2.4 GHz band. ⚠ The thesis's MiXiM runs used
# 82944 bps (archive/MintRouteProj/MintRouteProj/omnetpp.ini), neither rate.
# WHAT THE RATE CHANGES, checked before the change:
#  - Not the links. Range is set by the -85 dBm sensitivity (259.2 m). At the
#    range edge the SNIR over the -110 dBm noise is 25 dB, and BPSK's bit
#    error rate 0.5*erfc(sqrt(SNIR*B/R)) (BpskModulation.cc:27) is 0 at either
#    rate. Measured: Control at 250 kbps decodes 88 x degree on every node and
#    every fired: counter equals the 19.2 kbps run's.
#  - Capture when frames overlap. B/R falls from 146 to 11.2 (Eb/N0 -11 dB): a
#    90 B frame survives down to the -8 dB snirThreshold at 19.2 kbps but needs
#    about 0 dB at 250 kbps (PER 8e-4 at 0 dB, 0.64 at -4 dB). Frames are 13
#    times shorter, so they overlap less.
# To rerun at 19.2 kbps, add to the command line:
#   '--**.radio.transmitter.bitrate=19200bps' '--**.wlan[*].mac.bitrate=19200bps'
**.wlan[*].typename                   = "WirelessInterface"
**.wlan[*].radio.typename             = "ApskScalarRadio"
**.radio.centerFrequency              = 2.45GHz
**.radio.bandwidth                    = 2.8MHz
**.radio.transmitter.bitrate          = 250kbps
**.radio.transmitter.power            = 2.24mW
**.radio.transmitter.headerLength     = 8b
**.radio.transmitter.preambleDuration = 0.0001s
# ⚠ -85dBm, NOT -100dBm (MyWSN's). At -100dBm every node hears every other one
# and the four-hop field collapses into a mesh. Check `attr configname` and the
# PER-MODULE sensitivity line in the .sca before reading any result here.
**.radio.receiver.sensitivity         = -85dBm
**.radio.receiver.energyDetection     = -90dBm
**.radio.receiver.snirThreshold       = -8dB
**.maxTransmissionDuration            = 100ms
*.radioMedium.backgroundNoise.power   = -110dBm

# ---- MAC + queue: verbatim from ../v4_mintroute, except the bitrate (above) ----
**.wlan[*].mac.typename         = "Smac"
**.wlan[*].mac.listenDuration   = 0.3s
**.wlan[*].mac.frameDuration    = 1s
**.wlan[*].mac.allowedDrift     = 0.03s
**.wlan[*].mac.bitrate          = 250kbps
**.wlan[*].mac.headerLength     = 72b
**.wlan[*].mac.ctrlFrameLength  = 160b
**.wlan[*].mac.queueLength      = 10
**.wlan[*].queue.typename       = "DropTailQueue"
**.wlan[*].queue.packetCapacity = 20

*.configurator.addStaticRoutes  = false
*.configurator.addDefaultRoutes = false
*.configurator.addSubnetRoutes  = false


# ---------------------------------------------------------------------------
# [Config Control] -- plan step 1: the generated module as it is, no DSR code.
# The sink is not a destination (A1); each sensor creates an RREQ every 5 s and
# the model floods it; the RREP and RRER timers are off. Frames 10 B
# (headerLength 80b), the Q14 control size.
#
# The module (wsn-codegen 3f68fb5 + the uncommitted AODV and DSR names tables):
# `--v4 --routing dsr` is ../v4_aodv's module with INET AODV's names undone
# (sendRreqBroadcast(), onReceiveRreqPkt, create_rreqPkt), the RREQ transmit
# named sendRREQ after the Final Report (p.48), and its context C2_dsr. Checked
# at generation: the .ned identical, the .h/.cc differing by exactly those
# lines (tests/dsrRouting.test.ts).
#
# PREDICTION (written before the first run): renames only, so the behaviour is
#   ../v4_aodv's Control at 250 kbps exactly: event #26590 and every scalar
#   equal to ../v4_aodv/results/Control-#0.sca (the scalars carry Event-B
#   labels, fired:create_rreqPkt among them, which neither module renames).
#   11 RREQs per sensor, none on the sink, no RREP or RRER; send_down 88 on
#   every node; send_up = MAC Rx = 88 x degree (2816); add_newEntry 32; no
#   queue overflow.
# FALSIFIER: any other event number, or any scalar differing from ../v4_aodv's
#   Control.
# RESULT (2026-10-24): held. Event #26590; 649 of 649 scalars equal to
#   ../v4_aodv/results/Control-#0.sca (the radio medium's 31 quoted names
#   included); attr configname Control, network SensorScopeNetwork, -85 dBm and
#   250 kbps on the per-module lines.
# ---------------------------------------------------------------------------
[Config Control]
description = "generated structure 4, DSR split, no test code; plan settings"
*.sink.generic.typename    = "EbWsnNetworkLayer"
*.sensor*.generic.typename = "EbWsnNetworkLayer"
*.sink.generic.np.inDests  = false
*.sensor*.generic.np.rreqFloodsInterval = 5s
*.sink.generic.np.rreqFloodsInterval    = 0s
**.generic.np.rrepFloodsInterval = 0s
**.generic.np.rrerFloodsInterval = 0s
**.generic.np.headerLength = 80b

# ---------------------------------------------------------------------------
# STEP 3: the DSR test code (../../scratch/v4_dsr_2026-10-24/paste_dsr/, 13
# edits, every pasted line marked [DSR test code]) staged here; it runs only
# with dsr = true.
#
# REGRESSION (written before the run): with dsr = false the edited module
# behaves as generated: Control above = step 1, event #26590, 649 of 649.
#
# [Config Route360] -- each sensor without a cached path sends an RREQ on its
# RREQ tick; the model floods it, each node keeping the first copy's route
# record with its id appended; the sink answers each new one with an RREP
# carrying the reversed record, unicast back along it; the originator caches
# the route. 360 s, five runs, seed sets 0-4. Checked by route.mjs.
# PREDICTION (written before the first run):
#   route.mjs GREEN x5: every sensor caches a path through links of the field
#   (each a chain of heard neighbours ending at the sink), INET's route to the
#   sink via its first hop, addEntry never refused, no data, RREP or RRER
#   creating event, the sink starts no RREQ, no route record missing or over
#   MAX_PATHLEN, every RREP on its own path.
#   Each sensor's first RREQ at 5.1-5.9 s; at 250 kbps an RREP comes back in
#   well under 5 s (v4 AODV routed all eight by 13 s), so most sensors send one
#   RREQ and have a path within ~2 s of it: 8-12 RREQs a run (a second only
#   where no RREP came before the next tick). RREPs sent = the RREQs that
#   reached the sink; forwarded = the sum of (hops - 1) over the RREPs.
#   Paths: the first copy's route, mostly shortest (sensor6 1; sensor3, 5, 8
#   2; sensor2, 4, 7 3; sensor1 4); a path one hop longer than shortest may
#   occur (the first-copy effect AODV showed for sensor4 in #1 and #3) and is
#   reported, not a failure.
#   sensor6 ignores the sink's copy of each RREQ (about one per RREQ), no other
#   node any; no queue overflow; the model's neighbour tables agree with the
#   field's links.
# FALSIFIER: route.mjs RED in any run; any rreqPathMissing, pathTooLong or
#   rrepNotOnPath; queue overflow or more than 16 RREQs in a run would not be
#   failures but would mean the RREP latency or the tick-only retry (Q9) is off.
# RESULT (2026-10-24; edited files b5232c28 / 7f64e938 / a21e0296; events
#   #26691 #26613 #27268 #27274 #28079): route.mjs GREEN x5; invariants.sh GREEN
#   x5; type_check.sh and leak_check.sh GREEN on #0 (0 of 256 deliveries
#   waiting), staged module md5 restored. RREQs 8 / 8 / 8 / 8 / 10, every one
#   answered (RREPs sent = RREQs); forwarded 12 / 14 / 15 / 13 / 18 = the sum of
#   (hops - 1); every sensor routed by 12.1 s; addEntry refused 0; sink copies
#   ignored = the RREQs, all on sensor6; no queue overflow; the neighbour tables
#   equal the field's links; 2 RREPs decoded twice by SMAC (#2, #4) dropped as
#   duplicates. route.mjs is red-capable: 12 doctored copies of #0 (no path, a
#   hop that is no link, a path not ending at the sink, INET's route, an unheard
#   next hop, a missing record, a record over MAX_PATHLEN, an RREP off its path,
#   a sink RREQ, an RREP creating event; wrong config, -100 dBm) each FAIL or
#   REFUSE as stated.
#   ! "Mostly shortest, one longer may occur" held only in part: 6 of 40 paths
#   are one hop longer (0 / 2 / 3 / 1 / 0). TRACED (#2 at 5.2519 s, scratch
#   copy): the RREQ's rebroadcasts went out sensor4 +7.7 ms, sensor7 +8.8 ms,
#   sensor8 +17.0 ms, sensor3 +24 ms, sensor5 +25.8 ms; sensor5, the best
#   connected node, sent last after hearing five neighbours, so sensor6's first
#   copy came via sensor7-sensor8 and the sink kept that one (assumption 2 keeps
#   a cached path until a strictly shorter one comes). Why v4 AODV showed 2 of
#   40 is not established.
[Config Route360]
description = "the DSR test code: route discovery to the sink, 360 s, five runs"
extends = Control
**.generic.np.dsr = true
sim-time-limit = 360s
repeat = 5

# [Config Route360Plain] -- Q14's control: the route record costs nothing on
# the air (pathEntryLength 0B), every frame 10 B as in AODV.
# PREDICTION (written before the first run): route.mjs GREEN x5; the paths may
#   differ from Route360's only where two candidates were equally short (frame
#   lengths shift timings by under a millisecond a frame at 250 kbps).
# RESULT (2026-10-24; events #26815 #27497 #29326 #27094 #29378): route.mjs
#   GREEN x5; invariants.sh GREEN x5. RREQs 8 / 9 / 11 / 8 / 11, every one
#   answered; addEntry refused 0; no queue overflow; #2 replaced 2 cached paths
#   by strictly shorter ones (10 cache writes).
#   ! FALSIFIED on the paths: they differ from Route360's at nodes that are not
#   ties, because the sub-millisecond timing change reorders the rebroadcast race
#   above. The count of longer paths is the same, 6 of 40 (1 / 2 / 0 / 2 / 1),
#   so the route record's bytes are not what makes them.
[Config Route360Plain]
description = "Route360 with the route record free on the air (Q14 control)"
extends = Route360
**.generic.np.pathEntryLength = 0B

# ---------------------------------------------------------------------------
# STEP 4: the failure tests (plan Q3 b): one node dead before the first
# discovery. failAt = 1 s: the RREQ timer first fires at uniform(0.1, 0.9) + 5 s
# (EbWsn.cc:365), so no sensor has sent a model frame by then. From failAt on
# the node drops every timer and frame (the MAC keeps running), so it forwards
# no RREQ and can be in no route record. One run each (seed set 0), as the
# MintRoute and AODV failure configs. route.mjs refuses a run unless exactly the
# named node failed and it sent no model frame first.
#
# The field without the node (route.mjs's own rule, 259.2 m), shortest hops:
#   sensor5 dead: sensor1 4, sensor2 3, sensor3 2, sensor4 4 (was 3; via
#     sensor2 or sensor7), sensor6 1, sensor7 3 (via sensor8), sensor8 2.
#   sensor6 dead: no sensor reaches the sink (sensor6 is its only neighbour).
#
# [Config FailSensor5]
# PREDICTION (written before the first run): route.mjs GREEN; each of the seven
#   living sensors caches a path to the sink through links of the field, none
#   through sensor5; INET's route via path[0]; addEntry refused 0. sensor5
#   originates no RREQ and forwards nothing. RREQs 7-10 (one per living sensor,
#   a second only where the RREP came after the next tick), each answered;
#   all routed within about 15 s; no queue overflow; the living nodes'
#   neighbour tables equal the field's links without sensor5. A path one hop
#   longer than shortest may occur (the rebroadcast race of Route360) and is
#   reported. Fewer events than Route360 #0 (#26691): one node is silent.
# FALSIFIER: route.mjs RED or REFUSE; sensor5 in any path or neighbour table.
# RESULT (2026-10-24; event #26100): held. route.mjs GREEN: all seven living
#   sensors routed between 6.0 and 10.1 s, none through sensor5, INET's route
#   via path[0], addEntry refused 0; RREQs 7, one per living sensor, each
#   answered (RREPs forwarded 13); no queue overflow; neighbour tables equal the
#   field's links without sensor5, and no node heard sensor5. sensor5: no RREQ,
#   send_down 0, MAC Tx 0 (its MAC still decoded 55 frames). sensor4 4 hops via
#   sensor2, its shortest. sensor1 5 hops (sensor2-sensor7-sensor8-sensor6)
#   where 4 exist: the rebroadcast race again, reported. invariants.sh,
#   type_check.sh, leak_check.sh (0 of 140 deliveries waiting) GREEN.
[Config FailSensor5]
description = "sensor5 dead from 1 s, before the first RREQ; 360 s"
extends = Route360
repeat = 1
*.sensor5.generic.np.failAt = 1s

# [Config FailSensor6]
# PREDICTION (written before the first run): route.mjs GREEN; no sensor ends
#   with a path; no RREP is sent; the sink's routing receives nothing. Every
#   living sensor sends an RREQ on every tick, 71 each (first tick 5.1-5.9 s,
#   then every 5 s up to 360 s), 497 in all; the seven living sensors form one
#   connected part, so each forwards every other sensor's RREQ once:
#   send_down about 497 on each (fewer only where a node lost every copy of an
#   RREQ). No queue overflow.
# FALSIFIER: route.mjs RED or REFUSE; any RREP; a living sensor with fewer than
#   71 RREQs (the tick gate would be stopping a discovery that cannot succeed).
# RESULT (2026-10-24; event #124896): held exactly. route.mjs GREEN: no sensor
#   has a path; RREPs 0; the sink's routing received nothing (MAC Rx 0). Every
#   living sensor: RREQs 71, send_down 497 = MAC Tx; send_up = 497 x its living
#   degree (sensor2 2484, one frame short of 5 x 497). sensor6: no RREQ, MAC Tx
#   0, MAC Rx 1491 = 3 x 497 (its MAC keeps decoding). No queue overflow.
#   invariants.sh GREEN. route.mjs's failure gates are red-capable: 6 doctored
#   copies (sensor5 not failed, a second failure, sensor5 sending first ->
#   REFUSE; a path through sensor5, a living sensor without a path, a path in
#   FailSensor6 -> FAIL) each as stated.
[Config FailSensor6]
description = "sensor6, the sink's only neighbour, dead from 1 s; 360 s"
extends = Route360
repeat = 1
*.sensor6.generic.np.failAt = 1s

# ---------------------------------------------------------------------------
# STEP 5: the tree drawing (plan B3 a), its own TREE DRAWING block in the test
# code (edited files 4c2fd898 / e01aa3cf / a21e0296; since 2026-10-25 the .cc is
# b08e2331, one generated comment corrected, every result unchanged). With dsr on, the sink
# writes results/<config>-#<run>-tree.svg at the end of the run: an arrow from
# each sensor to its path's first hop, and every sensor's whole path listed,
# marked where it is not its first hop's own path. In Qtenv each sensor's arrow
# follows its cached path (the tooltip gives the whole path), and a failed node
# turns red.
# REGRESSION (written before the run): drawing only, so every run above ends at
#   the same event with every scalar unchanged.
# RESULT (2026-10-24): held. All 13 runs at their recorded events, 0 scalar
#   lines differing; tree_svg.mjs OK on all 12 pictures (8/8 doctored pictures
#   caught); the Qtenv arrows, drawn in Cmdenv with the GUI check removed in an
#   instrumented copy, matched every sensor's cached path in Route360 x5 and
#   the failure runs (56 of 56). Paths continuing as their first hop's own
#   path: Route360 7/7/6/8/8 of 8, Route360Plain 7/7/8/8/8, FailSensor5 6 of 7.

# ---------------------------------------------------------------------------
# THE DSR BASELINE (design/V4_DSR_Plan.md section 13, 2026-10-27): DSRRoute, an
# INET 4.5 network protocol shaped on the Final Report's printed MiXiM DSRRoute
# (Fig 6.8-6.12), harness code in this folder (DSRRoute.*, CTL6.*, DSRPkt.msg),
# libINET untouched. SensorApp on every sensor every 10 s from exponential(1s),
# 10 B, to the sink (Q7, as AODV's baseline); the old field, 250 kbps. On
# demand (FUN-3a, Q9): a datagram with no cached path is broadcast and floods,
# and starts an RREQ; the sink answers each new RREQ with an RREP back along
# the reversed record; only the originator caches, the first path kept (Q10,
# Q16). Every frame carries a 116 B header (Q14, Q15). No RRER (Q5).
# ⚠ Not independent of the v4 DSR test code: both are written from the same
# sources (plan Q2).
# PREDICTION (written before the first build and run):
#   * every sensor creates 36 datagrams (the first at about 1 s, then every
#     10 s up to 360 s);
#   * its first datagram finds no path: it is flooded (dataSentFlood 1) and
#     starts an RREQ (rreqOriginated 1); the RREP comes back within a few
#     seconds (v4 DSR routed every sensor by 12.1 s from its 5.1-5.9 s first
#     tick), so the second datagram already has a path: dataSentPath 35.
#     A sensor whose RREP misses that window floods its second datagram and
#     sends a second RREQ (dataSentFlood 2, rreqOriginated 2) - at most one or
#     two sensors per run;
#   * all eight sensors hold a path to the sink at 360 s, through real links,
#     next hop = path[1]; hop counts the shortest (s6 1, s3/s5/s8 2,
#     s2/s4/s7 3, s1 4) except where the first RREQ copy to reach the sink came
#     the long way (v4 DSR: 0-3 of 8 per run one hop longer);
#   * the sink receives about 288 datagrams (8 x 36), about 8 by flood and the
#     rest by path; a few may be lost to collisions;
#   * the sink answers one RREQ per discovery (rreqAnswered = the RREQs
#     originated), sends that many RREPs, and every RREP reaches its
#     originator (rrepReceived summed = rrepSent);
#   * hopLimitDrops 0, notOnPath 0, no queue overflow.
# FALSIFIER: a sensor without a path at 360 s; the sink receiving fewer than
#   260 datagrams; any hop-limit drop or notOnPath; queue overflow anywhere.
# RESULT (2026-10-27; events #112862 #107330 #119202 #121314 #109261): held;
#   baseline_dsr.mjs GREEN on all five. Every sensor: 36 datagrams, 1 flooded,
#   35 by path, ONE RREQ (no second discovery in any run), its path cached at
#   1.1-8.1 s. The sink: 288 of 288 received in every run (280 by path, 8 by
#   flood), = SensorApp's own count; 8 RREQs answered, 8 RREPs, all 8 received.
#   Paths longer than the shortest: 1/0/1/2/0 of 8 (sensor1 5 hops in #0 and
#   #3, sensor4 4 hops in #2 and #3). hopLimitDrops 0, notOnPath 0, no queue
#   overflow. Control (#26590, 649 scalars) and Route360 #0 (#26691) are
#   identical on the rebuilt executable.
[Config Baseline]
description = "the DSR baseline: DSRRoute + SensorApp every 10 s, 360 s, five runs"
sim-time-limit = 360s
repeat = 5
**.generic.typename = "DSRRouteNetworkLayer"
*.sensor*.numApps                = 1
*.sensor*.app[0].typename        = "SensorApp"
*.sensor*.app[0].sinkAddress     = "sink"
*.sensor*.app[0].sensingInterval = 10s
*.sensor*.app[0].startTime       = exponential(1s)
*.sensor*.app[0].payloadLength   = 10B
*.sensor*.app[0].networkProtocol = "dsrroute"
*.sink.numApps                   = 1
*.sink.app[0].typename           = "SensorApp"
*.sink.app[0].sinkAddress        = ""
*.sink.app[0].networkProtocol    = "dsrroute"
