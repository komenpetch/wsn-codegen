<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#44546a"/></marker></defs>
<rect width="900" height="330" fill="#fcfcfb"/>
<text x="20" y="28" font-size="17" font-weight="600" fill="#0b0b0b">From a Rodin project to one OMNeT++/INET module</text>

<rect x="20" y="60" width="130" height="70" rx="8" fill="#eef2f7" stroke="#44546a"/>
<text x="85" y="88" font-size="14" text-anchor="middle" fill="#0b0b0b" font-weight="600">Rodin project</text>
<text x="85" y="108" font-size="12" text-anchor="middle" fill="#3b4856">.bum machines</text>
<text x="85" y="123" font-size="12" text-anchor="middle" fill="#3b4856">.buc contexts</text>

<rect x="190" y="50" width="170" height="90" rx="8" fill="#dbe9f9" stroke="#2a78d6"/>
<text x="275" y="76" font-size="12" text-anchor="middle" fill="#2a78d6" font-weight="600">STEP 1</text>
<text x="275" y="97" font-size="14" text-anchor="middle" fill="#0b0b0b" font-weight="600">Parsing and</text>
<text x="275" y="114" font-size="14" text-anchor="middle" fill="#0b0b0b" font-weight="600">Flattening</text>
<text x="275" y="132" font-size="11" text-anchor="middle" fill="#3b4856">refinement chain → one model</text>

<rect x="400" y="50" width="170" height="90" rx="8" fill="#dbe9f9" stroke="#2a78d6"/>
<text x="485" y="76" font-size="12" text-anchor="middle" fill="#2a78d6" font-weight="600">STEP 2</text>
<text x="485" y="97" font-size="14" text-anchor="middle" fill="#0b0b0b" font-weight="600">Rule Mapping</text>
<text x="485" y="116" font-size="11" text-anchor="middle" fill="#3b4856">storage form per variable,</text>
<text x="485" y="131" font-size="11" text-anchor="middle" fill="#3b4856">rule per guard and action</text>

<rect x="610" y="50" width="150" height="90" rx="8" fill="#dbe9f9" stroke="#2a78d6"/>
<text x="685" y="76" font-size="12" text-anchor="middle" fill="#2a78d6" font-weight="600">STEP 3</text>
<text x="685" y="97" font-size="14" text-anchor="middle" fill="#0b0b0b" font-weight="600">Code</text>
<text x="685" y="114" font-size="14" text-anchor="middle" fill="#0b0b0b" font-weight="600">Generation</text>
<text x="685" y="132" font-size="11" text-anchor="middle" fill="#3b4856">state, methods, shell</text>

<rect x="790" y="60" width="95" height="70" rx="8" fill="#eaf5ea" stroke="#3a8a3a"/>
<text x="837" y="86" font-size="13" text-anchor="middle" fill="#0b0b0b" font-weight="600">3 files</text>
<text x="837" y="105" font-size="12" text-anchor="middle" fill="#3b4856">.h  .cc  .ned</text>
<text x="837" y="121" font-size="11" text-anchor="middle" fill="#3b4856">EbWsn</text>

<path d="M150,95 L188,95" stroke="#44546a" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M360,95 L398,95" stroke="#44546a" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M570,95 L608,95" stroke="#44546a" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M760,95 L788,95" stroke="#44546a" stroke-width="1.6" marker-end="url(#a)"/>

<text x="20" y="178" font-size="13" fill="#0b0b0b" font-weight="600">Structures 3 and 4 only: network-layer passes after step 3, in this order</text>
<rect x="20" y="190" width="865" height="112" rx="8" fill="#fff8e6" stroke="#c98a00" stroke-dasharray="5 4"/>
<g font-size="12" fill="#0b0b0b" text-anchor="middle">
<rect x="32" y="204" width="98" height="40" rx="5" fill="#ffffff" stroke="#c98a00"/><text x="81" y="221">pattern</text><text x="81" y="235">extension</text>
<rect x="138" y="204" width="98" height="40" rx="5" fill="#ffffff" stroke="#c98a00"/><text x="187" y="221">carry</text><text x="187" y="235">events</text>
<rect x="244" y="204" width="98" height="40" rx="5" fill="#ffffff" stroke="#c98a00"/><text x="293" y="221">packet</text><text x="293" y="235">classes</text>
<rect x="350" y="204" width="98" height="40" rx="5" fill="#ffffff" stroke="#c98a00"/><text x="399" y="221">network</text><text x="399" y="235">shell</text>
<rect x="456" y="204" width="98" height="40" rx="5" fill="#ffffff" stroke="#c98a00"/><text x="505" y="221">transmit</text><text x="505" y="235">methods</text>
<rect x="562" y="204" width="98" height="40" rx="5" fill="#ffffff" stroke="#c98a00"/><text x="611" y="221">node</text><text x="611" y="235">identity</text>
<rect x="668" y="204" width="98" height="40" rx="5" fill="#ffffff" stroke="#c98a00"/><text x="717" y="221">arrival</text><text x="717" y="235">binding</text>
<rect x="774" y="204" width="98" height="40" rx="5" fill="#ffffff" stroke="#c98a00"/><text x="823" y="221">event</text><text x="823" y="235">scheduler</text>
<rect x="32" y="254" width="146" height="36" rx="5" fill="#ffffff" stroke="#c98a00"/><text x="105" y="276">route publication</text>
<rect x="186" y="254" width="210" height="36" rx="5" fill="#ffffff" stroke="#2a78d6"/><text x="291" y="276">route entries and unicast (4)</text>
<rect x="404" y="254" width="190" height="36" rx="5" fill="#ffffff" stroke="#2a78d6"/><text x="499" y="276">baseline names (4)</text>
<rect x="602" y="254" width="190" height="36" rx="5" fill="#ffffff" stroke="#2a78d6"/><text x="697" y="276">route-table classes (4)</text>
</g>
<path d="M685,140 L685,188" stroke="#44546a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/>
<text x="885" y="178" font-size="12" fill="#2a78d6" text-anchor="end">blue outline: structure 4 only</text>
</svg>
