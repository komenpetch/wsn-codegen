name: Deploy to GitHub Pages
on:
  push: { branches: [main] }
permissions: { contents: read, pages: write, id-token: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm test
      # `npm run build` runs tsc -b, which now covers src/, scripts/ and tests/
      # through tsconfig.test.json. Until the netlayer merge (2026-09-12) the
      # network-layer TypeScript sat outside every referenced project and
      # reached CI unchecked; a separate typecheck:netlayer step covered it.
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/deploy-pages@v4
